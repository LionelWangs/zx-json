<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>装修预算与采购看板 V3.0</title>
    <!-- 本地像素字体 -->
    <style>
        @font-face {
            font-family: 'Zpix';
            src: url('fonts/Zpix.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }
        @font-face {
            font-family: 'Press Start 2P';
            src: url('fonts/PressStart2P.woff2') format('woff2');
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }
        @font-face {
            font-family: 'VT323';
            src: url('fonts/VT323.woff2') format('woff2');
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }
        @font-face {
            font-family: 'Share Tech Mono';
            src: url('fonts/ShareTechMono.woff2') format('woff2');
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }
    </style>
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <!-- SortableJS -->
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
    <!-- SheetJS & xlsx-js-style -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- GSAP -->
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>

    <style>
        /* ============================================================
           V5.0 CYBERPUNK 2077 DESIGN SYSTEM — Yellow · Cyan · Glitch
           ============================================================ */
        :root {
            /* ---- Background Palette (Cyberpunk 2077 Dark) ---- */
            --bg-deep: #0A0A0F;
            --bg-base: #0D0D14;
            --bg-surface: #12121A;
            --bg-elevated: #1A1A25;
            --bg-overlay: #1E1E2A;

            /* ---- Text Hierarchy (Cyberpunk 2077) ---- */
            --text-primary: #F0F0F0;
            --text-secondary: #D0D0D0;
            --text-tertiary: #8A8A8A;
            --text-quaternary: #5A5A5A;

            /* ---- Cyberpunk 2077 Accent Colors ---- */
            --accent-purple: #FCEE09;        /* 主色：黄色 */
            --accent-purple-light: #FFE44D;
            --accent-purple-dark: #D4C500;
            --accent-blue: #00F0FF;          /* 辅色：青色 */
            --accent-green: #00FF88;
            --accent-green-light: #40FFB0;
            --accent-yellow: #FCEE09;        /* 黄色 */
            --accent-orange: #FF6B00;
            --accent-pink: #FF0055;          /* 红粉色 */
            --accent-red: #FF0040;

            /* ---- Card Tokens (Cyberpunk 2077 Glass) ---- */
            --card-bg: rgba(18, 18, 26, 0.85);
            --card-border: rgba(252, 238, 9, 0.3);
            --card-border-hover: rgba(252, 238, 9, 0.6);
            --input-bg: rgba(18, 18, 26, 0.9);
            --input-border: rgba(252, 238, 9, 0.4);

            /* ---- Neon Glows (Cyberpunk 2077) ---- */
            --glow-purple: 0 0 10px rgba(252, 238, 9, 0.5), 0 0 20px rgba(252, 238, 9, 0.3);
            --glow-purple-intense: 0 0 15px rgba(252, 238, 9, 0.7), 0 0 30px rgba(252, 238, 9, 0.4), 0 0 45px rgba(252, 238, 9, 0.2);
            --glow-blue: 0 0 10px rgba(0, 240, 255, 0.5), 0 0 20px rgba(0, 240, 255, 0.3);
            --glow-pink: 0 0 10px rgba(255, 0, 85, 0.5), 0 0 20px rgba(255, 0, 85, 0.3);

            /* ---- Shadows (Cyberpunk 2077) ---- */
            --shadow-xs: 0 1px 2px rgba(0, 0, 0, 0.8);
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.7), 0 0 4px rgba(252, 238, 9, 0.1);
            --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.8), 0 0 8px rgba(252, 238, 9, 0.15);
            --shadow-lg: 0 8px 32px rgba(0, 0, 0, 0.9), 0 0 12px rgba(252, 238, 9, 0.2);
            --shadow-xl: 0 16px 48px rgba(0, 0, 0, 0.95), 0 0 20px rgba(252, 238, 9, 0.25);

            /* ---- Radius (Cyberpunk Sharp) ---- */
            --radius-2xl: 12px;
            --radius-xl: 10px;
            --radius-lg: 8px;
            --radius-md: 6px;
            --radius-sm: 4px;
            --radius-xs: 2px;
            --radius-full: 980px;

            /* ---- Spacing (4px grid) ---- */
            --space-xs: 4px;
            --space-sm: 8px;
            --space-md: 16px;
            --space-lg: 24px;
            --space-xl: 32px;
            --space-2xl: 48px;

            /* ---- Animation Curves (Cyberpunk 2077) ---- */
            --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
            --ease-out-expo: cubic-bezier(0.16, 1, 0.3, 1);
            --ease-smooth: cubic-bezier(0.25, 0.1, 0.25, 1);
            --ease-glitch: cubic-bezier(0.25, 0.46, 0.45, 0.94);

            /* ---- Duration Tokens ---- */
            --dur-fast: 100ms;
            --dur-normal: 180ms;
            --dur-slow: 300ms;

            /* ---- Cyberpunk 2077 Effects ---- */
            --scanline-opacity: 0.03;
            --grid-opacity: 0.05;
        }

        /* ============================================================
           GLOBAL RESET & BASE
           ============================================================ */
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        /* 全局字体继承 - 确保所有元素使用像素字体 */
        *, *::before, *::after {
            font-family: inherit;
        }

        html {
            font-family: "Zpix", "VT323", "Share Tech Mono", "Courier New", "Lucida Console", "Monaco", monospace;
            -webkit-font-smoothing: none;
            -moz-osx-font-smoothing: unset;
            font-smooth: never;
            -webkit-text-size-adjust: 100%;
            text-size-adjust: 100%;
        }

        body {
            font-family: "Zpix", "VT323", "Share Tech Mono", "Courier New", "Lucida Console", "Monaco", monospace;
            background-color: var(--bg-deep);
            color: var(--text-secondary);
            line-height: 1.5;
            font-weight: 400;
            letter-spacing: 0.05em;
            font-size: 16px;
            min-height: 100vh;
            padding-bottom: 40px;
            position: relative;
            overflow-x: hidden;
        }

        /* Cyberpunk Grid Background */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background:
                linear-gradient(rgba(252, 238, 9, var(--grid-opacity)) 1px, transparent 1px),
                linear-gradient(90deg, rgba(252, 238, 9, var(--grid-opacity)) 1px, transparent 1px);
            background-size: 50px 50px;
            pointer-events: none;
            z-index: 0;
        }

        /* Scanline Effect */
        body::after {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: repeating-linear-gradient(
                0deg,
                transparent,
                transparent 2px,
                rgba(0, 0, 0, var(--scanline-opacity)) 2px,
                rgba(0, 0, 0, var(--scanline-opacity)) 4px
            );
            pointer-events: none;
            z-index: 1;
            animation: scanline 8s linear infinite;
        }

        @keyframes scanline {
            0% { transform: translateY(0); }
            100% { transform: translateY(4px); }
        }

        /* ============================================================
           BORDER MARQUEE — 跑马灯呼吸灯效果
           ============================================================ */
        @keyframes borderMarquee {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }
        @keyframes borderBreathe {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 0.7; }
        }

        /* 跑马灯边框通用 mixin — 通过 ::before 伪元素实现 */
        .marquee-border {
            position: relative;
            overflow: visible;
        }
        .marquee-border::before {
            content: '';
            position: absolute;
            inset: -1px;
            border-radius: inherit;
            padding: 1px;
            background: linear-gradient(
                90deg,
                transparent 0%,
                var(--accent-purple) 15%,
                var(--accent-blue) 35%,
                var(--accent-purple) 55%,
                transparent 70%
            );
            background-size: 200% 100%;
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            animation: borderMarquee 4s linear infinite, borderBreathe 3s ease-in-out infinite;
            pointer-events: none;
            z-index: 0;
        }

        /* 应用跑马灯边框的组件 — 使用 ::after 避免覆盖已有的 ::before */
        .stat-card::after,
        .toolbar::after,
        .sidebar::after,
        .table-container::after,
        .chart-card::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: inherit;
            border: 1px solid transparent;
            background: linear-gradient(
                var(--bg-surface),
                var(--bg-surface)
            ) padding-box,
            linear-gradient(
                90deg,
                transparent 0%,
                var(--accent-purple) 15%,
                var(--accent-blue) 35%,
                var(--accent-purple) 55%,
                transparent 70%
            ) border-box;
            background-size: 100% 100%, 200% 100%;
            animation: borderMarquee 4s linear infinite, borderBreathe 3s ease-in-out infinite;
            pointer-events: none;
            z-index: -1;
        }

        /* header 底部已有的渐变线也加上跑马灯 */
        header::after {
            animation: borderMarquee 3s linear infinite, borderBreathe 4s ease-in-out infinite;
            background-size: 200% 100%;
        }

        /* ============================================================
           HEADER — Cyberpunk Glass
           ============================================================ */
        header {
            position: fixed;
            top: 0; left: 0; right: 0;
            z-index: 2000;
            background: rgba(10, 10, 15, 0.9);
            border-bottom: 1px solid var(--card-border);
            padding: 10px 28px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all var(--dur-slow) var(--ease-smooth);
            backdrop-filter: blur(20px);
        }

        header::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--accent-purple), var(--accent-blue), transparent);
        }

        header.scrolled {
            padding: 8px 28px;
            background: rgba(10, 10, 15, 0.95);
            box-shadow: 0 4px 30px rgba(252, 238, 9, 0.1);
        }

        header h1 {
            font-family: "Zpix", "Press Start 2P", "VT323", monospace;
            font-size: 16px;
            font-weight: 400;
            letter-spacing: 0.1em;
            color: var(--accent-purple-light);
            text-shadow: 0 0 20px rgba(252, 238, 9, 0.5);
            text-transform: uppercase;
        }

        .header-actions {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .header-actions-group {
            display: flex;
            gap: 2px;
            background: var(--card-bg);
            padding: 3px;
            border-radius: var(--radius-full);
            border: 1px solid var(--card-border);
        }

        /* ============================================================
           COLOR PICKER — Theme Color Selector
           ============================================================ */
        .color-picker-wrapper {
            position: relative;
        }
        .color-picker-btn i {
            font-size: 18px;
        }
        .color-picker-panel {
            display: none;
            position: absolute;
            top: 100%;
            right: 0;
            margin-top: 8px;
            background: var(--bg-elevated);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-md);
            padding: 16px;
            min-width: 200px;
            box-shadow: var(--shadow-lg);
            z-index: 3000;
            backdrop-filter: blur(20px);
        }
        .color-picker-panel.show { display: block; }
        .color-picker-title {
            font-family: "Zpix", "Press Start 2P", "VT323", monospace;
            font-size: 12px;
            color: var(--text-primary);
            margin-bottom: 12px;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }
        .color-presets {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 12px;
        }
        .color-swatch {
            width: 32px;
            height: 32px;
            border-radius: 4px;
            border: 2px solid transparent;
            cursor: pointer;
            transition: all var(--dur-normal) var(--ease-spring);
            position: relative;
        }
        .color-swatch:hover {
            transform: scale(1.15);
            box-shadow: 0 0 12px currentColor;
        }
        .color-swatch.active {
            border-color: #fff;
            box-shadow: 0 0 12px currentColor;
        }
        .color-swatch.active::after {
            content: '✓';
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #000;
            font-size: 16px;
            font-weight: 900;
        }
        .color-picker-custom {
            display: flex;
            align-items: center;
            gap: 10px;
            padding-top: 8px;
            border-top: 1px solid var(--card-border);
        }
        .color-picker-custom label {
            font-family: "Zpix", "VT323", monospace;
            font-size: 14px;
            color: var(--text-secondary);
        }
        .color-picker-custom input[type="color"] {
            width: 40px;
            height: 28px;
            border: 1px solid var(--card-border);
            border-radius: 4px;
            cursor: pointer;
            background: transparent;
            padding: 2px;
        }

        /* ============================================================
           BUTTON SYSTEM — Cyberpunk Neon
           ============================================================ */
        .btn {
            font-family: "Zpix", "Press Start 2P", "VT323", "Share Tech Mono", "Courier New", monospace;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 10px 20px;
            border-radius: var(--radius-sm);
            font-size: 10px;
            font-weight: 400;
            letter-spacing: 0.1em;
            cursor: pointer;
            border: 1px solid var(--card-border);
            transition: all var(--dur-normal) var(--ease-smooth);
            outline: none;
            text-decoration: none;
            position: relative;
            overflow: hidden;
            white-space: nowrap;
            text-transform: uppercase;
            background: var(--card-bg);
            color: var(--text-primary);
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(252, 238, 9, 0.2), transparent);
            transition: left 0.5s;
        }

        .btn:hover::before {
            left: 100%;
        }

        .btn:hover {
            border-color: var(--accent-purple);
            box-shadow: var(--glow-purple);
            color: var(--accent-purple-light);
        }

        .btn:active { transform: scale(0.95); }

        .btn-primary {
            background: linear-gradient(135deg, var(--accent-purple), var(--accent-purple-dark));
            color: #fff;
            font-weight: 700;
            border-color: var(--accent-purple);
            box-shadow: 0 0 15px rgba(252, 238, 9, 0.3);
        }
        .btn-primary:hover {
            background: linear-gradient(135deg, var(--accent-purple-light), var(--accent-purple));
            box-shadow: var(--glow-purple-intense);
            transform: translateY(-1px);
        }

        .btn-outline {
            background: transparent;
            color: var(--accent-purple-light);
            border: 1px solid var(--accent-purple);
        }
        .btn-outline:hover {
            background: rgba(252, 238, 9, 0.1);
            border-color: var(--accent-purple-light);
            box-shadow: var(--glow-purple);
            color: var(--accent-purple-light);
        }

        .btn-ghost {
            background: transparent;
            color: var(--text-tertiary);
            padding: 8px;
            border-radius: var(--radius-sm);
            border-color: transparent;
        }
        .btn-ghost:hover {
            color: var(--accent-purple-light);
            background: rgba(252, 238, 9, 0.1);
            border-color: rgba(252, 238, 9, 0.3);
        }
        .btn-ghost:hover i {
            transform: scale(1.1);
            filter: drop-shadow(0 0 5px var(--accent-purple));
        }
        .btn-ghost i {
            transition: all var(--dur-normal) var(--ease-spring);
        }

        .btn-danger { color: var(--text-tertiary); border-color: transparent; }
        .btn-danger:hover {
            color: var(--accent-red);
            background: rgba(255, 0, 64, 0.1);
            border-color: rgba(255, 0, 64, 0.3);
            box-shadow: 0 0 10px rgba(255, 0, 64, 0.2);
        }

        /* ============================================================
           LAYOUT — Sidebar + Main
           ============================================================ */
        .layout-wrapper {
            display: flex;
            max-width: 1440px;
            margin: 0 auto;
            padding: 16px;
            padding-top: 60px;
            gap: 16px;
            align-items: flex-start;
            position: relative;
            z-index: 1;
        }

        .sidebar {
            width: 180px;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            gap: 2px;
            position: sticky;
            top: 96px;
            background: var(--bg-surface);
            border-radius: var(--radius-md);
            padding: 8px;
            border: 1px solid var(--card-border);
            backdrop-filter: blur(10px);
        }

        .sidebar::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--accent-purple), transparent);
            opacity: 0.5;
        }

        .sidebar-section {
            padding: 10px 12px 6px;
        }

        .sidebar-label {
            font-family: "Zpix", "Press Start 2P", "VT323", monospace;
            font-size: 8px;
            font-weight: 400;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: var(--accent-purple);
            margin-bottom: 8px;
            padding-left: 4px;
            text-shadow: 0 0 8px rgba(252, 238, 9, 0.3);
        }

        .nav-item {
            font-family: "Zpix", "VT323", "Share Tech Mono", "Courier New", "Lucida Console", "Monaco", monospace;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 16px;
            border-radius: var(--radius-sm);
            background: transparent;
            color: var(--text-tertiary);
            border: 1px solid transparent;
            font-size: 20px;
            font-weight: 400;
            letter-spacing: 0.05em;
            cursor: pointer;
            transition: all var(--dur-normal) var(--ease-smooth);
            text-align: left;
            outline: none;
            position: relative;
            width: 100%;
        }

        .nav-item:hover {
            background: rgba(252, 238, 9, 0.08);
            color: var(--text-primary);
            border-color: rgba(252, 238, 9, 0.2);
        }

        .nav-item.active {
            background: rgba(252, 238, 9, 0.12);
            color: var(--accent-purple-light);
            font-weight: 600;
            border-color: rgba(252, 238, 9, 0.3);
            box-shadow: inset 0 0 15px rgba(252, 238, 9, 0.1);
        }

        .nav-item.active::before {
            content: '';
            position: absolute;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            width: 3px;
            height: 60%;
            background: var(--accent-purple);
            border-radius: 0 2px 2px 0;
            box-shadow: 0 0 8px var(--accent-purple);
        }

        .nav-item i {
            font-size: 18px;
            transition: all var(--dur-normal) var(--ease-spring);
            opacity: 0.6;
        }
        .nav-item:hover i { opacity: 1; }
        .nav-item.active i {
            opacity: 1;
            color: var(--accent-purple-light);
            filter: drop-shadow(0 0 5px var(--accent-purple));
        }

        .nav-badge {
            margin-left: auto;
            font-size: 11px;
            font-weight: 700;
            padding: 3px 10px;
            border-radius: var(--radius-full);
            background: var(--card-bg);
            color: var(--text-quaternary);
            border: 1px solid var(--card-border);
        }
        .nav-item.active .nav-badge {
            background: rgba(252, 238, 9, 0.15);
            color: var(--accent-purple-light);
            border-color: rgba(252, 238, 9, 0.3);
            box-shadow: 0 0 8px rgba(252, 238, 9, 0.2);
        }

        .main-content {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* ============================================================
           TOOLBAR — Cyberpunk Search & Filters
           ============================================================ */
        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            background: var(--bg-surface);
            padding: 8px 16px;
            border-radius: var(--radius-md);
            border: 1px solid var(--card-border);
            position: relative;
            z-index: 100;
            backdrop-filter: blur(10px);
        }

        .toolbar::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--accent-purple), transparent);
            opacity: 0.5;
        }

        .search-box {
            position: relative;
            width: 260px;
        }

        .search-box i {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--accent-purple);
            font-size: 15px;
            transition: all 0.2s;
            pointer-events: none;
        }

        .search-input {
            font-family: "Zpix", "VT323", "Share Tech Mono", monospace;
            width: 100%;
            padding: 10px 16px 10px 36px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--card-border);
            background: var(--input-bg);
            font-size: 18px;
            color: var(--text-primary);
            transition: all var(--dur-normal) var(--ease-smooth);
            outline: none;
            letter-spacing: 0.05em;
        }

        .search-input::placeholder {
            color: var(--text-quaternary);
            letter-spacing: 0.08em;
        }

        .search-input:focus {
            border-color: var(--accent-purple);
            box-shadow: 0 0 0 2px rgba(252, 238, 9, 0.15), var(--glow-purple);
        }

        .search-input:focus + i,
        .search-input:focus ~ i {
            color: var(--accent-purple-light);
            filter: drop-shadow(0 0 5px var(--accent-purple));
        }

        .filter-group {
            display: flex;
            gap: 2px;
            background: var(--bg-surface);
            padding: 3px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--card-border);
        }

        .filter-btn {
            font-family: "Zpix", "Press Start 2P", "VT323", monospace;
            padding: 8px 16px;
            border-radius: var(--radius-xs);
            font-size: 9px;
            font-weight: 400;
            letter-spacing: 0.1em;
            color: var(--text-tertiary);
            border: 1px solid transparent;
            background: transparent;
            cursor: pointer;
            transition: all var(--dur-normal) var(--ease-smooth);
            text-transform: uppercase;
        }

        .filter-btn:not(.active):hover {
            background: rgba(252, 238, 9, 0.1);
            color: var(--text-primary);
            border-color: rgba(252, 238, 9, 0.2);
        }

        .filter-btn.active {
            background: linear-gradient(135deg, var(--accent-purple), var(--accent-purple-dark));
            color: #fff;
            font-weight: 700;
            border-color: var(--accent-purple);
            box-shadow: 0 0 10px rgba(252, 238, 9, 0.3);
        }

        /* ============================================================
           BENTO GRID — Stats & Charts
           ============================================================ */
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1.3fr;
            gap: 10px;
        }

        .stats-subgrid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .stat-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-md);
            padding: 14px 16px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            transition: all var(--dur-slow) var(--ease-smooth);
            position: relative;
            overflow: hidden;
            cursor: default;
            backdrop-filter: blur(10px);
        }

        .stat-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--accent-purple), transparent);
            opacity: 0;
            transition: opacity var(--dur-slow);
        }

        .stat-card:hover {
            border-color: var(--card-border-hover);
            box-shadow: var(--glow-purple);
        }

        .stat-card:hover::before {
            opacity: 1;
        }

        /* Card color variants — neon glow borders */
        .stat-card.card-blue {
            border-left: 3px solid var(--accent-blue);
            box-shadow: inset 0 0 15px rgba(0, 240, 255, 0.05);
        }
        .stat-card.card-orange {
            border-left: 3px solid var(--accent-orange);
            box-shadow: inset 0 0 15px rgba(255, 107, 0, 0.05);
        }
        .stat-card.card-green {
            border-left: 3px solid var(--accent-green);
            box-shadow: inset 0 0 15px rgba(0, 255, 136, 0.05);
        }
        .stat-card.card-purple {
            border-left: 3px solid var(--accent-purple);
            box-shadow: inset 0 0 15px rgba(252, 238, 9, 0.05);
        }
        .stat-card.card-red {
            border-left: 3px solid var(--accent-red);
            box-shadow: inset 0 0 15px rgba(255, 0, 64, 0.05);
        }
        .stat-card.card-teal {
            border-left: 3px solid var(--accent-yellow);
            box-shadow: inset 0 0 15px rgba(255, 230, 0, 0.05);
        }

        .stat-card.over-budget {
            border-left-color: var(--accent-red);
            animation: glitch-border 2s infinite;
        }
        .stat-card.over-budget .value {
            color: var(--accent-red);
            text-shadow: 0 0 10px rgba(255, 0, 64, 0.5);
        }

        .stat-card.positive .value {
            color: var(--accent-green);
            text-shadow: 0 0 10px rgba(0, 255, 136, 0.5);
        }

        @keyframes glitch-border {
            0%, 95%, 100% { border-left-color: var(--accent-red); }
            96% { border-left-color: var(--accent-blue); transform: translateX(1px); }
            97% { border-left-color: var(--accent-purple); transform: translateX(-1px); }
            98% { border-left-color: var(--accent-red); transform: translateX(0); }
        }

        .stat-card .label {
            font-family: "Zpix", "Press Start 2P", "VT323", monospace;
            font-size: 9px;
            color: var(--accent-purple-light);
            font-weight: 400;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .stat-card .label i {
            font-size: 16px;
            opacity: 0.8;
            filter: drop-shadow(0 0 5px var(--accent-purple));
        }

        .stat-card.card-blue .label { color: var(--accent-blue); }
        .stat-card.card-blue .label i { filter: drop-shadow(0 0 5px var(--accent-blue)); }
        .stat-card.card-green .label { color: var(--accent-green); }
        .stat-card.card-green .label i { filter: drop-shadow(0 0 5px var(--accent-green)); }
        .stat-card.card-orange .label { color: var(--accent-blue); }
        .stat-card.card-orange .label i { filter: drop-shadow(0 0 5px var(--accent-blue)); }

        .stat-card .value {
            font-family: "Zpix", "Press Start 2P", "VT323", monospace;
            font-size: 24px;
            font-weight: 400;
            color: var(--text-primary);
            letter-spacing: 0.05em;
            line-height: 1.3;
            font-variant-numeric: tabular-nums;
            text-shadow: 0 0 20px rgba(252, 238, 9, 0.3);
        }

        .stat-card.card-blue .value { text-shadow: 0 0 20px rgba(0, 240, 255, 0.3); }
        .stat-card.card-green .value { text-shadow: 0 0 20px rgba(0, 255, 136, 0.3); }
        .stat-card.card-orange .value { text-shadow: 0 0 20px rgba(0, 240, 255, 0.3); }
        .stat-card.card-purple .value { text-shadow: 0 0 20px rgba(252, 238, 9, 0.3); }

        /* ============================================================
           CHARTS — Unified card style
           ============================================================ */
        .charts-container {
            margin-bottom: 0;
        }

        .charts-grid {
            display: grid;
            grid-template-columns: 3fr 2fr;
            gap: 10px;
        }

        .chart-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-md);
            padding: 20px 24px;
            transition: all var(--dur-slow) var(--ease-smooth);
            display: flex;
            flex-direction: column;
            gap: 16px;
            position: relative;
            overflow: hidden;
            backdrop-filter: blur(10px);
        }

        .chart-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--accent-blue), transparent);
            opacity: 0;
            transition: opacity var(--dur-slow);
        }

        .chart-card:hover {
            border-color: var(--card-border-hover);
            box-shadow: var(--glow-blue);
        }

        .chart-card:hover::before {
            opacity: 1;
        }

        .chart-header {
            font-family: "Zpix", "Press Start 2P", "VT323", monospace;
            font-size: 10px;
            font-weight: 400;
            color: var(--accent-blue);
            letter-spacing: 0.1em;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 8px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--card-border);
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.3);
        }

        .chart-body {
            position: relative;
            flex: 1;
            min-height: 240px;
            width: 100%;
        }

        /* ============================================================
           DATA TABLE — Cyberpunk Style
           ============================================================ */
        .table-container {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-md);
            overflow: hidden;
            position: relative;
            backdrop-filter: blur(10px);
        }

        .table-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--accent-purple), var(--accent-blue), transparent);
            z-index: 1;
        }

        table {
            border-collapse: collapse;
            border-spacing: 0;
            width: 100%;
        }

        th {
            font-family: "Zpix", "Press Start 2P", "VT323", monospace;
            background: rgba(252, 238, 9, 0.08);
            padding: 14px 16px;
            font-size: 10px;
            font-weight: 400;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--accent-purple-light);
            border-bottom: 1px solid var(--card-border);
            position: sticky;
            top: 0;
            z-index: 10;
            user-select: none;
            white-space: nowrap;
            text-shadow: 0 0 10px rgba(252, 238, 9, 0.3);
        }

        .resize-handle {
            position: absolute;
            right: 0;
            top: 0;
            bottom: 0;
            width: 6px;
            cursor: col-resize;
            background: transparent;
            z-index: 15;
            transition: background 0.15s;
        }
        .resize-handle:hover,
        .resize-handle.active {
            background: var(--accent-yellow);
        }

        th.sortable {
            cursor: pointer;
            transition: color 0.15s, background 0.15s;
        }
        th.sortable:hover {
            color: var(--text-secondary);
            background: rgba(255,255,255,0.03);
        }
        th.sortable i {
            margin-left: 3px;
            font-size: 13px;
            opacity: 0.25;
            transition: opacity 0.15s, transform 0.3s var(--ease-spring);
        }
        th.sortable:hover i { opacity: 0.6; }
        th.sortable.active i { opacity: 1; color: var(--accent-blue); }
        th.sortable.active.desc i { transform: rotate(180deg); }

        td {
            font-family: "Zpix", "VT323", "Share Tech Mono", "Courier New", "Lucida Console", "Monaco", monospace;
            padding: 14px 16px;
            font-size: 18px;
            border-bottom: 1px solid rgba(252, 238, 9, 0.06);
            vertical-align: middle;
            background: transparent;
            transition: all var(--dur-normal) var(--ease-smooth);
            font-variant-numeric: tabular-nums;
            color: var(--text-secondary);
        }

        tr {
            transition: all var(--dur-normal) var(--ease-smooth);
        }

        tr:hover td {
            background: rgba(252, 238, 9, 0.05);
        }

        tr:hover {
            box-shadow: inset 0 0 20px rgba(252, 238, 9, 0.03);
        }

        tr:last-child td { border-bottom: none; }

        /* Over-budget row - glitch effect */
        tr.row-over-budget td {
            background: rgba(255, 0, 64, 0.04);
        }
        tr.row-over-budget:hover td {
            background: rgba(255, 0, 64, 0.08);
            box-shadow: inset 0 0 15px rgba(255, 0, 64, 0.05);
        }
        tr.row-over-budget td[data-col="actualPrice"] {
            color: var(--accent-red);
            font-weight: 700;
            text-shadow: 0 0 8px rgba(255, 0, 64, 0.5);
        }

        /* Drag handle */
        .drag-handle {
            cursor: grab;
            color: var(--text-quaternary);
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color 0.15s, background 0.15s;
            padding: 4px;
            border-radius: var(--radius-sm);
        }
        .drag-handle:hover {
            color: var(--text-tertiary);
            background: var(--card-bg);
        }
        .drag-handle:active { cursor: grabbing; transform: scale(0.9); }

        .sortable-ghost { opacity: 0.2; background: rgba(187, 159, 58, 0.08); border-radius: var(--radius-md); }
        .sortable-drag {
            background: var(--bg-surface);
            box-shadow: var(--shadow-lg);
            cursor: grabbing !important;
            border-radius: var(--radius-md);
            border: 1px solid var(--card-border);
            transform: scale(1.01);
        }

        /* ============================================================
           STATUS BADGES — Cyberpunk Neon
           ============================================================ */
        .status-badge {
            font-family: "Zpix", "Press Start 2P", "VT323", monospace;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 6px 14px;
            border-radius: var(--radius-xs);
            font-size: 9px;
            font-weight: 400;
            letter-spacing: 0.1em;
            white-space: nowrap;
            min-width: 60px;
            text-transform: uppercase;
            border: 1px solid;
        }
        .status-badge::before {
            content: '';
            display: inline-block;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            margin-right: 8px;
            animation: badge-pulse 2s ease-in-out infinite;
        }

        @keyframes badge-pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(0.8); }
        }

        .status-done {
            background: rgba(0, 255, 136, 0.08);
            color: var(--accent-green);
            border-color: rgba(0, 255, 136, 0.3);
            box-shadow: 0 0 8px rgba(0, 255, 136, 0.15);
        }
        .status-done::before {
            background: var(--accent-green);
            box-shadow: 0 0 6px var(--accent-green);
        }

        .status-paid {
            background: rgba(0, 240, 255, 0.08);
            color: var(--accent-blue);
            border-color: rgba(0, 240, 255, 0.3);
            box-shadow: 0 0 8px rgba(0, 240, 255, 0.15);
        }
        .status-paid::before {
            background: var(--accent-blue);
            box-shadow: 0 0 6px var(--accent-blue);
        }

        .status-pending {
            background: rgba(255, 230, 0, 0.08);
            color: var(--accent-yellow);
            border-color: rgba(255, 230, 0, 0.3);
            box-shadow: 0 0 8px rgba(255, 230, 0, 0.15);
        }
        .status-pending::before {
            background: var(--accent-yellow);
            box-shadow: 0 0 6px var(--accent-yellow);
        }

        /* ============================================================
           COLUMN MENU
           ============================================================ */
        .column-menu {
            position: absolute;
            top: 100%;
            right: 0;
            margin-top: 8px;
            background: var(--bg-surface);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-md);
            padding: 6px;
            box-shadow: var(--shadow-lg);
            z-index: 1000;
            display: flex;
            flex-direction: column;
            gap: 2px;
            min-width: 150px;
        }

        .column-menu label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: var(--text-primary);
            padding: 7px 10px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: background 0.15s;
            white-space: nowrap;
        }
        .column-menu label:hover {
            background: var(--card-bg);
        }
        .column-menu input[type="checkbox"] {
            accent-color: var(--accent-yellow);
        }

        /* ============================================================
           MODAL / SHEET — Cyberpunk Style
           ============================================================ */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(10, 10, 15, 0.85);
            z-index: 3000;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            visibility: hidden;
            transition: all var(--dur-slow) var(--ease-smooth);
            backdrop-filter: blur(8px);
        }
        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal {
            background: var(--bg-surface);
            border-radius: var(--radius-lg);
            width: 100%;
            max-width: 560px;
            box-shadow: var(--shadow-xl), var(--glow-purple-intense);
            transform: translateY(20px) scale(0.97);
            transition: all 0.4s var(--ease-spring);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            min-height: 500px;
            max-height: calc(100vh - 60px);
            border: 1px solid var(--accent-purple);
            position: relative;
        }

        .modal::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--accent-purple), var(--accent-blue), var(--accent-pink), transparent);
            z-index: 1;
        }

        .modal::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background:
                linear-gradient(rgba(252, 238, 9, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(252, 238, 9, 0.03) 1px, transparent 1px);
            background-size: 20px 20px;
            pointer-events: none;
            z-index: 0;
        }

        .modal-overlay.active .modal {
            transform: translateY(0) scale(1);
        }

        /* Sheet drag indicator (only on main modal) */
        .sheet-indicator {
            width: 40px;
            height: 4px;
            background: linear-gradient(90deg, var(--accent-purple), var(--accent-blue));
            border-radius: 2px;
            margin: 12px auto 0;
            box-shadow: 0 0 8px rgba(252, 238, 9, 0.3);
        }

        .modal-header {
            padding: 20px 28px 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--card-border);
            position: relative;
            z-index: 1;
        }
        .modal-header h2 {
            font-family: "Zpix", "Press Start 2P", "VT323", monospace;
            font-size: 14px;
            font-weight: 400;
            letter-spacing: 0.1em;
            color: var(--accent-purple-light);
            text-transform: uppercase;
            text-shadow: 0 0 15px rgba(252, 238, 9, 0.4);
        }

        .modal-header .btn-ghost {
            width: 34px;
            height: 34px;
            border-radius: var(--radius-sm);
            background: var(--card-bg);
            transition: all var(--dur-normal) var(--ease-spring);
            border: 1px solid var(--card-border);
        }
        .modal-header .btn-ghost:hover {
            background: rgba(255, 0, 64, 0.1);
            border-color: rgba(255, 0, 64, 0.3);
            box-shadow: 0 0 10px rgba(255, 0, 64, 0.2);
        }

        .modal-body {
            padding: 16px 28px 24px;
            overflow-y: auto;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px 14px;
            flex: 1;
        }
        .modal-body::-webkit-scrollbar { width: 4px; }
        .modal-body::-webkit-scrollbar-track { background: transparent; }
        .modal-body::-webkit-scrollbar-thumb { background: var(--card-border); border-radius: 10px; }

        .form-group { display: flex; flex-direction: column; gap: 8px; }
        .form-group.full { grid-column: span 2; }
        .form-group label {
            font-family: "Zpix", "Press Start 2P", "VT323", monospace;
            font-size: 9px;
            font-weight: 400;
            letter-spacing: 0.1em;
            color: var(--accent-purple-light);
            text-transform: uppercase;
        }

        .form-control {
            font-family: "Zpix", "VT323", "Share Tech Mono", monospace;
            padding: 10px 14px;
            border: 1px solid var(--card-border);
            border-radius: var(--radius-sm);
            font-size: 18px;
            color: var(--text-primary);
            background: var(--input-bg);
            transition: all var(--dur-normal) var(--ease-smooth);
            outline: none;
            width: 100%;
            letter-spacing: 0.05em;
        }
        .form-control:hover { border-color: rgba(252, 238, 9, 0.3); }
        .form-control:focus {
            border-color: var(--accent-purple);
            box-shadow: 0 0 0 2px rgba(252, 238, 9, 0.15), var(--glow-purple);
        }
        .form-control option { background: var(--bg-elevated); color: var(--text-primary); }
        textarea.form-control {
            resize: vertical;
            min-height: 60px;
            line-height: 1.5;
        }

        .modal-footer {
            padding: 14px 28px 20px;
            border-top: 1px solid var(--card-border);
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }

        body.modal-open { overflow: hidden; }
        #fileInput { display: none; }

        /* ============================================================
           EMPTY STATE — Cyberpunk Style
           ============================================================ */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-tertiary);
            background: var(--card-bg);
            border-radius: var(--radius-md);
            border: 1px solid var(--card-border);
            margin: 20px;
            position: relative;
            overflow: hidden;
        }

        .empty-state::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--accent-purple), transparent);
            opacity: 0.5;
        }

        .empty-state::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background:
                linear-gradient(rgba(252, 238, 9, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(252, 238, 9, 0.02) 1px, transparent 1px);
            background-size: 30px 30px;
            pointer-events: none;
        }

        .empty-state i {
            font-size: 48px;
            color: var(--accent-purple);
            margin-bottom: 16px;
            display: block;
            filter: drop-shadow(0 0 15px rgba(252, 238, 9, 0.5));
        }
        .empty-state p {
            font-family: "Zpix", "VT323", "Share Tech Mono", monospace;
            font-size: 20px;
            font-weight: 400;
            letter-spacing: 0.08em;
            color: var(--text-secondary);
        }

        /* ============================================================
           MOBILE RESPONSIVE (≤768px)
           ============================================================ */
        @media (max-width: 768px) {
            header {
                padding: 10px 16px;
                flex-wrap: wrap;
                gap: 8px;
            }
            header h1 { font-size: 17px; }
            .header-actions {
                width: 100%;
                justify-content: flex-start;
                flex-wrap: wrap;
                gap: 4px;
            }

            .layout-wrapper {
                flex-direction: column;
                padding: 12px;
                padding-top: 12px;
                gap: 14px;
            }

            .sidebar {
                width: 100%;
                flex-direction: row;
                position: static;
                overflow-x: auto;
                -webkit-overflow-scrolling: touch;
                gap: 2px;
                padding: 4px;
                border-radius: var(--radius-lg);
            }
            .sidebar-section { display: none; }
            .nav-item {
                flex: 0 0 auto;
                padding: 8px 14px;
                white-space: nowrap;
                font-size: 13px;
                border-radius: var(--radius-full);
            }
            .nav-item:hover { transform: none; }
            .nav-badge { display: none; }

            .stats-grid {
                grid-template-columns: 1fr 1fr;
                gap: 8px;
            }
            .stat-card[style*="grid-column"] {
                grid-column: 1 / -1 !important;
            }
            .stat-card[style*="grid-row"] {
                grid-row: auto !important;
            }
            .stats-subgrid { gap: 8px; }

            .stat-card {
                padding: 14px 16px;
                gap: 4px;
            }
            .stat-card .value {
                font-size: 24px;
                background: none;
                -webkit-text-fill-color: var(--text-primary);
                color: var(--text-primary);
            }
            .stat-card.over-budget .value { -webkit-text-fill-color: var(--accent-red); }
            .stat-card.positive .value { -webkit-text-fill-color: var(--accent-green); }
            .stat-card .label { font-size: 10px; }

            .charts-grid { grid-template-columns: 1fr; }
            .chart-card { padding: 14px; }
            .chart-body { min-height: 180px; }

            .toolbar {
                flex-direction: column;
                align-items: stretch;
                gap: 8px;
                padding: 8px 12px;
            }
            .search-box { width: 100%; }
            .filter-group {
                overflow-x: auto;
                -webkit-overflow-scrolling: touch;
                white-space: nowrap;
            }
            .column-menu { right: auto; left: 0; }

            .table-container {
                overflow-x: hidden;
                border-radius: var(--radius-lg);
            }

            table { width: 100%; table-layout: fixed; min-width: 100%; }
            table th, table td {
                padding: 8px 2px;
                font-size: 10px;
                text-align: center !important;
            }

            /* Hide non-essential columns */
            table th[data-col="drag"], table td[data-col="drag"],
            table th[data-col="priority"], table td[data-col="priority"],
            table th[data-col="category"], table td[data-col="category"],
            table th[data-col="brand"], table td[data-col="brand"],
            table th[data-col="quantity"], table td[data-col="quantity"],
            table th[data-col="diffPrice"], table td[data-col="diffPrice"],
            table th[data-col="channel"], table td[data-col="channel"],
            table th[data-col="notes"], table td[data-col="notes"] {
                display: none !important;
            }

            table th[data-col="name"], table td[data-col="name"] {
                width: auto !important;
                min-width: 0 !important;
                max-width: none !important;
                white-space: normal;
                word-break: break-all;
                padding-left: 4px !important;
                padding-right: 4px;
                text-align: left !important;
            }

            table th[data-col="budgetPrice"], table th[data-col="actualPrice"] {
                font-size: 0;
                width: 46px !important;
                min-width: 46px !important;
                max-width: 46px !important;
            }
            table th[data-col="budgetPrice"]::before { content: "预算"; font-size: 10px; }
            table th[data-col="actualPrice"]::before { content: "实际"; font-size: 10px; }

            table td[data-col="budgetPrice"], table td[data-col="actualPrice"] {
                font-size: 10px;
                width: 46px !important;
                min-width: 46px !important;
                max-width: 46px !important;
                overflow: hidden;
                text-overflow: ellipsis;
            }

            table th[data-col="status"], table td[data-col="status"] {
                width: 40px !important;
                min-width: 40px !important;
                max-width: 40px !important;
            }

            .status-badge {
                width: 8px;
                height: 8px;
                min-width: 8px;
                padding: 0;
                font-size: 0;
                border-radius: 50%;
                background: transparent;
            }
            .status-badge::before { width: 8px; height: 8px; margin-right: 0; }

            table th[data-col="actions"], table td[data-col="actions"] {
                width: 40px !important;
                min-width: 40px !important;
                max-width: 40px !important;
            }
            table td[data-col="actions"] .btn { padding: 2px; }
            table td[data-col="actions"] .btn i { font-size: 15px; }

            .modal {
                max-width: 100%;
                min-height: 100dvh;
                max-height: 100dvh;
                border-radius: 0;
                margin: 0;
            }
            .modal-body {
                padding: 12px 16px;
                grid-template-columns: 1fr;
                gap: 10px;
            }
            .modal-footer { padding: 12px 16px 28px; }
            .form-group.full { grid-column: span 1; }

            /* Touch: disable hover-only effects */
            @media (hover: none) {
                tr:hover td { background: transparent; }
                tr.row-over-budget:hover td { background: rgba(255,69,58,0.04); }
                .stat-card:hover { transform: none; }
                .stat-card:hover::before { opacity: 0; }
                .chart-card:hover { transform: none; }
            }
        }

        /* ============================================================
           QUALITY: Scrollbar, Selection, Reduced Motion — Cyberpunk
           ============================================================ */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg-deep); }
        ::-webkit-scrollbar-thumb {
            background: linear-gradient(180deg, var(--accent-purple), var(--accent-blue));
            border-radius: 3px;
            box-shadow: 0 0 6px rgba(252, 238, 9, 0.3);
        }
        ::-webkit-scrollbar-thumb:hover {
            background: linear-gradient(180deg, var(--accent-purple-light), var(--accent-blue));
            box-shadow: 0 0 10px rgba(252, 238, 9, 0.5);
        }
        * { scrollbar-width: thin; scrollbar-color: var(--accent-purple) var(--bg-deep); }

        ::selection {
            background: rgba(252, 238, 9, 0.4);
            color: #FFF;
            text-shadow: 0 0 10px rgba(252, 238, 9, 0.5);
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }

        /* ============================================================
           TOAST NOTIFICATIONS — Cyberpunk Neon
           ============================================================ */
        #toast-container {
            position: fixed;
            bottom: 28px;
            right: 28px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 10px;
            pointer-events: none;
        }

        .toast {
            font-family: "Zpix", "VT323", "Share Tech Mono", monospace;
            pointer-events: auto;
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 20px;
            border-radius: var(--radius-sm);
            background: var(--bg-surface);
            border: 1px solid var(--card-border);
            box-shadow: var(--shadow-lg);
            font-size: 18px;
            font-weight: 400;
            letter-spacing: 0.05em;
            color: var(--text-primary);
            min-width: 280px;
            max-width: 420px;
            transform: translateX(120%);
            opacity: 0;
            transition: transform 0.4s var(--ease-spring), opacity 0.3s ease;
            position: relative;
            overflow: hidden;
            backdrop-filter: blur(10px);
        }

        .toast::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, currentColor, transparent);
            opacity: 0.5;
        }

        .toast.show { transform: translateX(0); opacity: 1; }
        .toast.hide { transform: translateX(120%); opacity: 0; }
        .toast::before {
            content: '';
            position: absolute;
            left: 0; top: 0; bottom: 0;
            width: 3px;
        }
        .toast.success {
            border-color: rgba(0, 255, 136, 0.3);
            box-shadow: 0 0 15px rgba(0, 255, 136, 0.1);
        }
        .toast.success::before { background: var(--accent-green); box-shadow: 0 0 8px var(--accent-green); }

        .toast.error {
            border-color: rgba(255, 0, 64, 0.3);
            box-shadow: 0 0 15px rgba(255, 0, 64, 0.1);
        }
        .toast.error::before { background: var(--accent-red); box-shadow: 0 0 8px var(--accent-red); }

        .toast.info {
            border-color: rgba(0, 240, 255, 0.3);
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.1);
        }
        .toast.info::before { background: var(--accent-blue); box-shadow: 0 0 8px var(--accent-blue); }

        .toast i { font-size: 18px; }
        .toast.success i { color: var(--accent-green); filter: drop-shadow(0 0 5px var(--accent-green)); }
        .toast.error i { color: var(--accent-red); filter: drop-shadow(0 0 5px var(--accent-red)); }
        .toast.info i { color: var(--accent-blue); filter: drop-shadow(0 0 5px var(--accent-blue)); }

        /* ============================================================
           RIPPLE EFFECT
           ============================================================ */
        .ripple-container {
            position: absolute;
            inset: 0;
            border-radius: inherit;
            overflow: hidden;
            pointer-events: none;
            z-index: 0;
        }
        .ripple {
            position: absolute;
            border-radius: 50%;
            background: rgba(255,255,255,0.3);
            pointer-events: none;
        }
        .btn-primary .ripple { background: rgba(255,255,255,0.4); }
        .btn-danger .ripple { background: rgba(255,69,58,0.35); }
        .btn { position: relative; overflow: hidden; }

        /* ============================================================
           ROW LEAVE ANIMATION
           ============================================================ */
        tr.row-leave {
            overflow: hidden;
        }
        tr.row-leave td { padding: 0 !important; border: none !important; }

        .search-input.no-result {
            border-color: rgba(255,69,58,0.3);
        }

        /* ============================================================
           BACKGROUND ORB
           ============================================================ */
        .bg-orb { display: none; }
    </style>
</head>
<body>

    <header>
        <h1>装修预算面板 V3.0</h1>
        <div class="header-actions">
            <div class="header-actions-group">

                    <i class="ph ph-cloud-arrow-up" style="font-size: 16px;"></i> 推送

                </button>
            </div>
            
            <button class="btn btn-outline" onclick="document.getElementById('fileInput').click()">
                <i class="ph ph-upload-simple"></i> 导入 JSON
            </button>
            <input type="file" id="fileInput" accept=".json" onchange="importJSON(event)">
            
            <button class="btn btn-outline" onclick="exportJSON()">
                <i class="ph ph-download-simple"></i> 导出 JSON
            </button>
            <button class="btn btn-outline" onclick="openJsonModal()">
                <i class="ph ph-code"></i> JSON 数据
            </button>
            <button class="btn btn-outline" onclick="exportExcel()">
                <i class="ph ph-file-xls"></i> 导出 Excel
            </button>
            <button class="btn btn-primary" onclick="openModal()">
                <i class="ph ph-plus"></i> 新增项目
            </button>
            <!-- 颜色选择器 -->
            <div class="color-picker-wrapper">
                <button class="btn btn-ghost color-picker-btn" onclick="toggleColorPicker()" title="切换主题色">
                    <i class="ph ph-palette"></i>
                </button>
                <div class="color-picker-panel" id="colorPickerPanel">
                    <div class="color-picker-title">主题色</div>
                    <div class="color-presets">
                        <button class="color-swatch active" data-color="#FCEE09" style="background:#FCEE09" title="赛博黄"></button>
                        <button class="color-swatch" data-color="#00F0FF" style="background:#00F0FF" title="青色"></button>
                        <button class="color-swatch" data-color="#FF0055" style="background:#FF0055" title="粉色"></button>
                        <button class="color-swatch" data-color="#00FF88" style="background:#00FF88" title="绿色"></button>
                        <button class="color-swatch" data-color="#FF6B00" style="background:#FF6B00" title="橙色"></button>
                        <button class="color-swatch" data-color="#B825F0" style="background:#B825F0" title="紫色"></button>
                    </div>
                    <div class="color-picker-custom">
                        <label>自定义</label>
                        <input type="color" id="customColorInput" value="#FCEE09" onchange="applyThemeColor(this.value)">
                    </div>
                </div>
            </div>
        </div>
    </header>

    <div class="layout-wrapper">
        <aside class="sidebar">
            <div class="sidebar-section">
                <div class="sidebar-label">浏览</div>
            </div>
            <button class="nav-item active" onclick="switchTab('table')" id="tab-table">
                <i class="ph ph-list-dashes"></i> 预算明细
                <span class="nav-badge" id="nav-count">0</span>
            </button>
            <button class="nav-item" onclick="switchTab('charts')" id="tab-charts">
                <i class="ph ph-chart-pie-slice"></i> 图表分析
            </button>
            <div class="sidebar-section" style="margin-top: auto;">
                <div class="sidebar-label">数据</div>
            </div>
            <button class="nav-item" onclick="openSettingsModal()">
                <i class="ph ph-gear"></i> 同步设置
            </button>
        </aside>

        <div class="main-content">
            <!-- 工具栏 (搜索、筛选) -->
            <div class="toolbar" id="toolbarView">
                <div class="search-box">
                    <i class="ph ph-magnifying-glass"></i>
                    <input type="text" class="search-input" id="searchInput" placeholder="搜索名称、品牌或备注..." oninput="handleFilter()">
                </div>
                <div class="filter-group" id="categoryFilter" style="margin-right: auto; margin-left: 12px;">
                    <button class="filter-btn active" data-category="all" onclick="setCategoryFilter('all')">全部分类</button>
                    <button class="filter-btn" data-category="硬装" onclick="setCategoryFilter('硬装')">硬装</button>
                    <button class="filter-btn" data-category="家电" onclick="setCategoryFilter('家电')">家电</button>
                    <button class="filter-btn" data-category="必要支出" onclick="setCategoryFilter('必要支出')">必要支出</button>
                </div>
                <div class="filter-group" id="statusFilter">
                    <button class="filter-btn active" data-status="all" onclick="setFilter('all')">全部状态</button>
                    <button class="filter-btn" data-status="待购" onclick="setFilter('待购')">待购</button>
                    <button class="filter-btn" data-status="付款" onclick="setFilter('付款')">付款</button>
                    <button class="filter-btn" data-status="完成" onclick="setFilter('完成')">完成</button>
                </div>
                <!-- 列展示筛选 -->
                <div class="filter-group column-filter" id="columnFilter" style="margin-left: 12px; position: relative;">
                    <button class="filter-btn" onclick="toggleColumnMenu()">
                        <i class="ph ph-columns"></i> 列显示 <i class="ph ph-caret-down" style="font-size: 12px; margin-left: 4px;"></i>
                    </button>
                    <div id="columnMenu" class="column-menu" style="display: none;">
                        <label><input type="checkbox" checked onchange="toggleColumn('priority')"> 优先度</label>
                        <label><input type="checkbox" checked onchange="toggleColumn('category')"> 分类</label>
                        <label><input type="checkbox" checked onchange="toggleColumn('brand')"> 品牌</label>
                        <label><input type="checkbox" checked onchange="toggleColumn('quantity')"> 数量</label>
                        <label><input type="checkbox" checked onchange="toggleColumn('budgetPrice')"> 预算金额</label>
                        <label><input type="checkbox" checked onchange="toggleColumn('actualPrice')"> 实际金额</label>
                        <label><input type="checkbox" checked onchange="toggleColumn('diffPrice')"> 差额</label>
                        <label><input type="checkbox" checked onchange="toggleColumn('channel')"> 购买渠道</label>
                        <label><input type="checkbox" checked onchange="toggleColumn('status')"> 状态</label>
                        <label><input type="checkbox" checked onchange="toggleColumn('notes')"> 备注</label>
                        <label><input type="checkbox" checked onchange="toggleColumn('actions')"> 操作</label>
                    </div>
                </div>
            </div>

        <!-- Bento Grid 统计面板 -->
        <div class="stats-grid">
            <div class="stat-card card-blue">
                <div class="label"><i class="ph ph-wallet"></i> 总预算</div>
                <div class="value" id="stat-budget">0</div>
            </div>
            <div class="stat-card card-orange" id="card-actual">
                <div class="label"><i class="ph ph-credit-card"></i> 实际支出</div>
                <div class="value" id="stat-actual">0</div>
            </div>
            <div class="stat-card card-green" id="card-diff" style="grid-row: span 1;">
                <div class="label"><i class="ph ph-scales"></i> 预算差额</div>
                <div class="value" id="stat-diff">0</div>
                <div style="font-size: 11px; color: var(--text-tertiary); margin-top: 2px;" id="stat-diff-sub">预算内，状况良好</div>
            </div>
            <div class="stat-card card-purple" style="grid-column: 1 / -1;">
                <div class="label"><i class="ph ph-chart-pie-slice"></i> 完成率</div>
                <div style="display: flex; align-items: center; gap: 20px;">
                    <div class="value" id="stat-rate" style="font-size: 42px;">0%</div>
                    <div style="display: flex; gap: 16px; flex-wrap: wrap;" id="category-mini-cards">
                    </div>
                </div>
            </div>
        </div>

        <!-- 图表与数据可视化 -->
        <div class="charts-container" id="chartsView" style="display: none;">
            <div class="charts-grid" id="chartsGrid">
                <div class="chart-card">
                    <div class="chart-header"><i class="ph ph-chart-bar"></i> 预算 vs 实际支出对比</div>
                    <div class="chart-body">
                        <canvas id="barChart"></canvas>
                    </div>
                </div>
                <div class="chart-card">
                    <div class="chart-header"><i class="ph ph-chart-donut"></i> 采购状态分布</div>
                    <div class="chart-body">
                        <canvas id="doughnutChart"></canvas>
                    </div>
                </div>
            </div>
        </div>

        <!-- 数据表格 -->
        <div class="table-container" id="tableView">
            <table>
                <thead>
                    <tr>
                        <th width="40" data-col="drag"></th>
                        <th class="sortable" onclick="handleSort('name')" data-col="name">名称 <i class="ph ph-caret-down"></i></th>
                        <th class="sortable" width="85" onclick="handleSort('priority')" data-col="priority">优先度 <i class="ph ph-caret-down"></i></th>
                        <th class="sortable" onclick="handleSort('category')" data-col="category">分类 <i class="ph ph-caret-down"></i></th>
                        <th class="sortable" onclick="handleSort('brand')" data-col="brand">品牌 <i class="ph ph-caret-down"></i></th>
                        <th data-col="quantity">数量</th>
                        <th class="sortable" onclick="handleSort('budgetPrice')" data-col="budgetPrice">预算金额 <i class="ph ph-caret-down"></i></th>
                        <th class="sortable" onclick="handleSort('actualPrice')" data-col="actualPrice">实际金额 <i class="ph ph-caret-down"></i></th>
                        <th class="sortable" onclick="handleSort('diffPrice')" data-col="diffPrice">差额 <i class="ph ph-caret-down"></i></th>

                        <th class="sortable" onclick="handleSort('status')" data-col="status">状态 <i class="ph ph-caret-down"></i></th>

    </div>

    <!-- 弹窗 -->

            </div>

                </div>
                
                <div class="form-group">
                    <label>分类</label>
                    <select class="form-control" id="form-category">

                </div>
                
                <div class="form-group">

                <div class="form-group">
                    <label>数量</label>
                    <input type="number" class="form-control" id="form-quantity" min="1" value="1">
                </div>
                
                <div class="form-group">
                    <label>预算金额 (¥)</label>
                    <input type="number" class="form-control" id="form-budget" min="0" value="0">
                </div>
                
                <div class="form-group">
                    <label>实际金额 (¥)</label>
                    <input type="number" class="form-control" id="form-actual" min="0" value="0">
                </div>

                    <input type="text" class="form-control" id="form-channel" placeholder="如：线下实体店、京东">

                <button class="btn btn-primary" onclick="saveData()">保存</button>
            </div>
        </div>
    </div>

    <!-- 弹窗：云端设置 -->
    <div class="modal-overlay" id="settingsModalOverlay">
        <div class="modal">
            <div class="modal-header">
                <h2><i class="ph ph-cloud-arrow-up"></i> 云端同步设置</h2>
                <button class="btn btn-ghost" onclick="closeSettingsModal()"><i class="ph ph-x" style="font-size: 20px;"></i></button>

            <div class="modal-body">
                <div class="form-group full">
                    <label>同步平台 (Platform)</label>

                    <label>Personal Access Token (必填)</label>
