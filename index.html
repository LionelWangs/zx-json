                    border: { ...thinBorder, bottom: { style: "thin", color: { rgb: "B8D9FF" } } }
                }),
                // 卡片数值 — 蓝色（实际支出）
                cardValueBlue: S({
                    font: { bold: true, sz: 14, color: { rgb: "0A84FF" } },
                    fill: "EBF5FF",
                    alignment: { horizontal: "center" },
                    border: { ...thinBorder, bottom: { style: "thin", color: { rgb: "B8D9FF" } } }
                }),
                // 卡片数值 — 绿色（正差额）
                cardValueGreen: S({
                    font: { bold: true, sz: 14, color: { rgb: "30D158" } },
                    fill: "E8F8EE",
                    alignment: { horizontal: "center" },
                    border: { ...thinBorder, bottom: { style: "thin", color: { rgb: "B8EDCA" } } }
                }),
                // 卡片数值 — 红色（负差额）
                cardValueRed: S({
                    font: { bold: true, sz: 14, color: { rgb: "FF453A" } },
                    fill: "FFECEF",
                    alignment: { horizontal: "center" },
                    border: { ...thinBorder, bottom: { style: "thin", color: { rgb: "FFC0C0" } } }
                }),
                // 卡片数值 — 橙色（完成率）
                cardValueOrange: S({
                    font: { bold: true, sz: 14, color: { rgb: "FF9F0A" } },
                    fill: "FFF5E6",
                    alignment: { horizontal: "center" },
                    border: { ...thinBorder, bottom: { style: "thin", color: { rgb: "FFD9A0" } } }
                }),

                // 分类汇总标题
                catTitle: S({ font: { bold: true, sz: 13, color: { rgb: "1D1D1F" } }, alignment: { horizontal: "left" } }),

                // 分类汇总表头
                catHeader: S({
                    font: { bold: true, sz: 10, color: { rgb: "FFFFFF" } },
                    fill: "3A3A3C",
                    alignment: { horizontal: "center" },
                    border: { top: { style: "thin", color: { rgb: "2C2C2E" } }, bottom: { style: "thin", color: { rgb: "2C2C2E" } } }
                }),

                // 分类数据行（交替底色）
                catData: S({ alignment: { horizontal: "center" }, border: bottomThin }),
                catDataAlt: S({ alignment: { horizontal: "center" }, fill: "F5F5F7", border: bottomThin }),
                catDataName: S({ font: { bold: true }, alignment: { horizontal: "left" }, border: bottomThin }),
                catDataNameAlt: S({ font: { bold: true }, alignment: { horizontal: "left" }, fill: "F5F5F7", border: bottomThin }),
                catDataProgress: S({ font: { sz: 10, color: { rgb: "0A84FF" }, bold: true }, alignment: { horizontal: "left" }, border: bottomThin }),
                catDataProgressAlt: S({ font: { sz: 10, color: { rgb: "0A84FF" }, bold: true }, alignment: { horizontal: "left" }, fill: "F5F5F7", border: bottomThin }),
                catDataBudget: S({ font: { color: { rgb: "0A84FF" }, bold: true }, alignment: { horizontal: "right" }, border: bottomThin }),
                catDataBudgetAlt: S({ font: { color: { rgb: "0A84FF" }, bold: true }, alignment: { horizontal: "right" }, fill: "F5F5F7", border: bottomThin }),
                catDataActual: S({ font: { color: { rgb: "FF9F0A" }, bold: true }, alignment: { horizontal: "right" }, border: bottomThin }),
                catDataActualAlt: S({ font: { color: { rgb: "FF9F0A" }, bold: true }, alignment: { horizontal: "right" }, fill: "F5F5F7", border: bottomThin }),

                // 明细标题
                detailTitle: S({ font: { bold: true, sz: 13, color: { rgb: "1D1D1F" } }, alignment: { horizontal: "left" } }),

                // 明细表头
                detailHeader: S({
                    font: { bold: true, sz: 11, color: { rgb: "FFFFFF" } },
                    fill: "0A84FF",
                    alignment: { horizontal: "center" },
                    border: thinBorder
                }),

                // 明细数据行 — 基础
                dataCell: S({ alignment: { horizontal: "center" }, border: thinBorder }),
                dataCellAlt: S({ alignment: { horizontal: "center" }, fill: "FAFAFA", border: thinBorder }),
                dataName: S({ font: { bold: true, sz: 11 }, alignment: { horizontal: "left" }, border: thinBorder }),
                dataNameAlt: S({ font: { bold: true, sz: 11 }, alignment: { horizontal: "left" }, fill: "FAFAFA", border: thinBorder }),
                dataSubtle: S({ font: { color: { rgb: "86868B" } }, alignment: { horizontal: "center" }, border: thinBorder }),
                dataSubtleAlt: S({ font: { color: { rgb: "86868B" } }, alignment: { horizontal: "center" }, fill: "FAFAFA", border: thinBorder }),

                // 金额列
                amount: S({ alignment: { horizontal: "right" }, border: thinBorder, numFmt: '#,##0' }),
                amountAlt: S({ alignment: { horizontal: "right" }, fill: "FAFAFA", border: thinBorder, numFmt: '#,##0' }),
                amountBold: S({ font: { bold: true }, alignment: { horizontal: "right" }, border: thinBorder, numFmt: '#,##0' }),
                amountBoldAlt: S({ font: { bold: true }, alignment: { horizontal: "right" }, fill: "FAFAFA", border: thinBorder, numFmt: '#,##0' }),

                // 差额颜色
                diffGreen: S({ font: { bold: true, color: { rgb: "30D158" } }, alignment: { horizontal: "right" }, border: thinBorder, numFmt: '#,##0' }),
                diffGreenAlt: S({ font: { bold: true, color: { rgb: "30D158" } }, alignment: { horizontal: "right" }, fill: "FAFAFA", border: thinBorder, numFmt: '#,##0' }),
                diffRed: S({ font: { bold: true, color: { rgb: "FF453A" } }, alignment: { horizontal: "right" }, border: thinBorder, numFmt: '#,##0' }),
                diffRedAlt: S({ font: { bold: true, color: { rgb: "FF453A" } }, alignment: { horizontal: "right" }, fill: "FAFAFA", border: thinBorder, numFmt: '#,##0' }),
                diffPending: S({ font: { color: { rgb: "86868B" } }, alignment: { horizontal: "center" }, border: thinBorder }),
                diffPendingAlt: S({ font: { color: { rgb: "86868B" } }, alignment: { horizontal: "center" }, fill: "FAFAFA", border: thinBorder }),

                // 超预算实际金额
                actualOver: S({ font: { bold: true, color: { rgb: "FF453A" } }, alignment: { horizontal: "right" }, border: thinBorder, numFmt: '#,##0' }),
                actualOverAlt: S({ font: { bold: true, color: { rgb: "FF453A" } }, alignment: { horizontal: "right" }, fill: "FFF5F5", border: thinBorder, numFmt: '#,##0' }),

                // 超预算行底色
                overBudget: S({ alignment: { horizontal: "center" }, fill: "FFF5F5", border: thinBorder }),
                overBudgetName: S({ font: { bold: true, sz: 11 }, alignment: { horizontal: "left" }, fill: "FFF5F5", border: thinBorder }),
                overBudgetSubtle: S({ font: { color: { rgb: "86868B" } }, alignment: { horizontal: "center" }, fill: "FFF5F5", border: thinBorder }),
                overBudgetAmount: S({ alignment: { horizontal: "right" }, fill: "FFF5F5", border: thinBorder, numFmt: '#,##0' }),

                // 状态色块（更鲜艳）
                statusDone: S({ font: { bold: true, color: { rgb: "FFFFFF" } }, fill: "30D158", alignment: { horizontal: "center" }, border: thinBorder }),
                statusPaid: S({ font: { bold: true, color: { rgb: "FFFFFF" } }, fill: "FF9F0A", alignment: { horizontal: "center" }, border: thinBorder }),
                statusPending: S({ font: { bold: true, color: { rgb: "FFFFFF" } }, fill: "0A84FF", alignment: { horizontal: "center" }, border: thinBorder }),
                statusDoneAlt: S({ font: { bold: true, color: { rgb: "FFFFFF" } }, fill: "30D158", alignment: { horizontal: "center" }, border: thinBorder }),
                statusPaidAlt: S({ font: { bold: true, color: { rgb: "FFFFFF" } }, fill: "FF9F0A", alignment: { horizontal: "center" }, border: thinBorder }),
                statusPendingAlt: S({ font: { bold: true, color: { rgb: "FFFFFF" } }, fill: "0A84FF", alignment: { horizontal: "center" }, border: thinBorder }),

                // 优先度（色块背景）
                prioHigh: S({ font: { bold: true, color: { rgb: "FFFFFF" } }, fill: "FF453A", alignment: { horizontal: "center" }, border: thinBorder }),
                prioMid: S({ font: { bold: true, color: { rgb: "FFFFFF" } }, fill: "FF9F0A", alignment: { horizontal: "center" }, border: thinBorder }),
                prioLow: S({ font: { bold: true, color: { rgb: "FFFFFF" } }, fill: "8E8E93", alignment: { horizontal: "center" }, border: thinBorder }),
                prioHighAlt: S({ font: { bold: true, color: { rgb: "FFFFFF" } }, fill: "FF453A", alignment: { horizontal: "center" }, border: thinBorder }),
                prioMidAlt: S({ font: { bold: true, color: { rgb: "FFFFFF" } }, fill: "FF9F0A", alignment: { horizontal: "center" }, border: thinBorder }),
                prioLowAlt: S({ font: { bold: true, color: { rgb: "FFFFFF" } }, fill: "8E8E93", alignment: { horizontal: "center" }, border: thinBorder }),

                // 分类分组标题（明细区内）
                groupHeader: S({
                    font: { bold: true, sz: 11, color: { rgb: "1D1D1F" } },
                    fill: "ECECEC",
                    alignment: { horizontal: "left" },
                    border: { top: { style: "thin", color: { rgb: "D1D1D6" } }, bottom: { style: "thin", color: { rgb: "D1D1D6" } } }
                }),

                // 备注
                notes: S({ font: { color: { rgb: "86868B" } }, alignment: { horizontal: "left", wrapText: true }, border: thinBorder }),
                notesAlt: S({ font: { color: { rgb: "86868B" } }, alignment: { horizontal: "left", wrapText: true }, fill: "FAFAFA", border: thinBorder }),
                notesOver: S({ font: { color: { rgb: "86868B" } }, alignment: { horizontal: "left", wrapText: true }, fill: "FFF5F5", border: thinBorder }),

                // 空单元格
                empty: S({})
            };

            // ========== 5. 合并单元格 ==========
            ws['!merges'] = [
                // 标题行：跨 11 列
                { s: { r: rowMap.title, c: 0 }, e: { r: rowMap.title, c: 10 } },
                // 卡片区域：4 张卡片，每张 2 行
                // 卡片1: 总预算 (col 0-2)
                { s: { r: rowMap.cardLabel, c: 0 }, e: { r: rowMap.cardLabel, c: 2 } },
                { s: { r: rowMap.cardValue, c: 0 }, e: { r: rowMap.cardValue, c: 2 } },
                // 卡片2: 实际支出 (col 3-5)
                { s: { r: rowMap.cardLabel, c: 3 }, e: { r: rowMap.cardLabel, c: 5 } },
                { s: { r: rowMap.cardValue, c: 3 }, e: { r: rowMap.cardValue, c: 5 } },
                // 卡片3: 预算差额 (col 6-8)
                { s: { r: rowMap.cardLabel, c: 6 }, e: { r: rowMap.cardLabel, c: 8 } },
                { s: { r: rowMap.cardValue, c: 6 }, e: { r: rowMap.cardValue, c: 8 } },
                // 卡片4: 完成率 (col 9-10)
                { s: { r: rowMap.cardLabel, c: 9 }, e: { r: rowMap.cardLabel, c: 10 } },
                { s: { r: rowMap.cardValue, c: 9 }, e: { r: rowMap.cardValue, c: 10 } },
                // 分类标题：跨 5 列
                { s: { r: rowMap.catTitle, c: 0 }, e: { r: rowMap.catTitle, c: 4 } },
                // 明细标题：跨 11 列
                { s: { r: rowMap.detailTitle, c: 0 }, e: { r: rowMap.detailTitle, c: 10 } }
            ];

            // ========== 6. 行高配置 ==========
            ws['!rows'] = [];
            const setRowH = (r, h) => { ws['!rows'][r] = { hpx: h }; };

            setRowH(rowMap.title, 40);         // 标题行
            setRowH(rowMap.cardLabel, 22);       // 卡片标签
            setRowH(rowMap.cardValue, 38);       // 卡片数值（大字号）
            setRowH(rowMap.catTitle, 32);        // 分类标题
            setRowH(rowMap.catHeader, 28);       // 分类表头
            setRowH(rowMap.detailTitle, 32);     // 明细标题
            setRowH(rowMap.detailHeader, 32);    // 明细表头

            // 分类数据行 + 明细数据行（含分组标题）
            for (let R = rowMap.catDataStart; R < rowMap.catDataStart + catKeys.length; R++) {
                setRowH(R, 30);
            }
            detailRowMap.forEach(entry => {
                if (entry.type === 'groupHeader') setRowH(entry.row, 32);
                else setRowH(entry.row, 36);
            });

            // ========== 7. 应用样式 ==========
            const setCell = (r, c, style) => {
                const ref = XLSX.utils.encode_cell({ c, r });
                if (!ws[ref]) ws[ref] = { t: 's', v: '' };
                ws[ref].s = style;
            };

            // --- 标题行 ---
            setCell(rowMap.title, 0, styles.title);

            // --- 卡片标签行（每张卡片独立色调） ---
            // 卡片1=蓝(总预算), 卡片2=橙(实际支出), 卡片3=绿/红(差额), 卡片4=橙(完成率)
            const cardLabelMap = [styles.cardLabelBlue, styles.cardLabelOrange, diffPrice >= 0 ? styles.cardLabelGreen : styles.cardLabelRed, styles.cardLabelOrange];
            for (let c = 0; c <= 10; c++) {
                const cardIdx = c <= 2 ? 0 : c <= 5 ? 1 : c <= 8 ? 2 : 3;
                setCell(rowMap.cardLabel, c, cardLabelMap[cardIdx]);
            }

            // --- 卡片数值行 ---
            const cardValueStyles = [styles.cardValue, styles.cardValueBlue, diffPrice >= 0 ? styles.cardValueGreen : styles.cardValueRed, styles.cardValueOrange];
            for (let c = 0; c <= 10; c++) {
                const cardIdx = c <= 2 ? 0 : c <= 5 ? 1 : c <= 8 ? 2 : 3;
                setCell(rowMap.cardValue, c, cardValueStyles[cardIdx]);
            }

            // --- 分类汇总标题 ---
            setCell(rowMap.catTitle, 0, styles.catTitle);

            // --- 分类汇总表头 ---
            for (let c = 0; c <= 4; c++) {
                setCell(rowMap.catHeader, c, styles.catHeader);
            }

            // --- 分类数据行（交替底色 + 彩色金额） ---
            for (let i = 0; i < catKeys.length; i++) {
                const R = rowMap.catDataStart + i;
                const isAlt = i % 2 === 1;
                setCell(R, 0, isAlt ? styles.catDataNameAlt : styles.catDataName);      // 分类名
                setCell(R, 1, isAlt ? styles.catDataBudgetAlt : styles.catDataBudget);    // 总预算（蓝）
                setCell(R, 2, isAlt ? styles.catDataActualAlt : styles.catDataActual);    // 实际支出（橙）
                setCell(R, 3, isAlt ? styles.catDataProgressAlt : styles.catDataProgress); // 进度条（蓝）
                setCell(R, 4, isAlt ? styles.catDataAlt : styles.catData);                // 项目数
            }

            // --- 明细清单标题 ---
            setCell(rowMap.detailTitle, 0, styles.detailTitle);

            // --- 明细表头 ---
            for (let c = 0; c <= 10; c++) {
                setCell(rowMap.detailHeader, c, styles.detailHeader);
            }

            // --- 明细数据行（按分类分组） ---
            let globalDataIdx = 0; // 全局数据行序号（用于交替行底色）
            let groupColorIdx = 0;  // 分类组颜色索引
            detailRowMap.forEach(entry => {
                const R = entry.row;

                // 分类分组标题行（彩色）
                if (entry.type === 'groupHeader') {
                    const cp = catPalette[groupColorIdx % catPalette.length];
                    const grpStyle = S({
                        font: { bold: true, sz: 11, color: { rgb: cp.accent } },
                        fill: cp.bg,
                        alignment: { horizontal: "left" },
                        border: { top: { style: "thin", color: { rgb: cp.accent } }, bottom: { style: "thin", color: { rgb: cp.accent } } }
                    });
                    setCell(R, 0, grpStyle);
                    ws['!merges'].push({ s: { r: R, c: 0 }, e: { r: R, c: 10 } });
                    groupColorIdx++;
                    return;
                }

                // 数据行
                const item = entry.item;
                const i = globalDataIdx++;
                const bPrice = Number(item.budgetPrice) || 0;
                const aPrice = Number(item.actualPrice) || 0;
                const isAlt = i % 2 === 1;       // 交替行
                const isOver = bPrice > 0 && aPrice > bPrice; // 超预算

                // Col 0: 名称
                setCell(R, 0, isOver ? styles.overBudgetName : (isAlt ? styles.dataNameAlt : styles.dataName));

                // Col 1: 优先度
                const prio = item.priority;
                if (prio === '高') setCell(R, 1, isAlt ? styles.prioHighAlt : styles.prioHigh);
                else if (prio === '中') setCell(R, 1, isAlt ? styles.prioMidAlt : styles.prioMid);
                else setCell(R, 1, isAlt ? styles.prioLowAlt : styles.prioLow);

                // Col 2: 分类
                setCell(R, 2, isOver ? styles.overBudget : (isAlt ? styles.dataSubtleAlt : styles.dataSubtle));

                // Col 3: 品牌
                setCell(R, 3, isOver ? styles.overBudgetSubtle : (isAlt ? styles.dataSubtleAlt : styles.dataSubtle));

                // Col 4: 数量
                setCell(R, 4, isOver ? styles.overBudget : (isAlt ? styles.dataCellAlt : styles.dataCell));

                // Col 5: 预算金额
                setCell(R, 5, isOver ? styles.overBudgetAmount : (isAlt ? styles.amountAlt : styles.amount));

                // Col 6: 实际金额
                if (isOver) setCell(R, 6, isAlt ? styles.actualOverAlt : styles.actualOver);
                else setCell(R, 6, isAlt ? styles.amountBoldAlt : styles.amountBold);

                // Col 7: 差额
                if (item.status === '待购') {
                    setCell(R, 7, isAlt ? styles.diffPendingAlt : styles.diffPending);
                } else {
                    const diff = bPrice - aPrice;
                    if (diff < 0) setCell(R, 7, isAlt ? styles.diffRedAlt : styles.diffRed);
                    else setCell(R, 7, isAlt ? styles.diffGreenAlt : styles.diffGreen);
                }

                // Col 8: 购买渠道
                setCell(R, 8, isOver ? styles.overBudgetSubtle : (isAlt ? styles.dataSubtleAlt : styles.dataSubtle));

                // Col 9: 状态
                const status = item.status;
                if (status === '完成') setCell(R, 9, isAlt ? styles.statusDoneAlt : styles.statusDone);
                else if (status === '付款') setCell(R, 9, isAlt ? styles.statusPaidAlt : styles.statusPaid);
                else setCell(R, 9, isAlt ? styles.statusPendingAlt : styles.statusPending);

                // Col 10: 备注
                setCell(R, 10, isOver ? styles.notesOver : (isAlt ? styles.notesAlt : styles.notes));
            });

            // ========== 8. 列宽配置 ==========
            ws['!cols'] = [
                { wpx: 160 }, // 名称
                { wpx: 60 },  // 优先度
                { wpx: 80 },  // 分类
                { wpx: 120 }, // 品牌
                { wpx: 50 },  // 数量
                { wpx: 110 }, // 预算金额
                { wpx: 110 }, // 实际金额
                { wpx: 100 }, // 差额
                { wpx: 120 }, // 购买渠道
                { wpx: 80 },  // 状态
                { wpx: 260 }  // 备注
            ];

            // ========== 9. 冻结窗格（明细表头固定） ==========
            ws['!freeze'] = {
                xSplit: 0,
                ySplit: rowMap.detailHeader + 1,
                topLeft: XLSX.utils.encode_cell({ c: 0, r: rowMap.detailHeader + 1 }),
                state: 'frozen'
            };

            // ========== 10. 导出文件 ==========
            XLSX.utils.book_append_sheet(wb, ws, "预算清单");
            XLSX.writeFile(wb, `装修预算_${dateStr}.xlsx`);
        }

        // ============================================================
        // 颜色选择器 — 自定义主题色
        // ============================================================
        function toggleColorPicker() {
            const panel = document.getElementById('colorPickerPanel');
            panel.classList.toggle('show');
            // 点击外部关闭
            if (panel.classList.contains('show')) {
                setTimeout(() => {
                    document.addEventListener('click', closeColorPickerOutside);
                }, 0);
            } else {
                document.removeEventListener('click', closeColorPickerOutside);
            }
        }

        function closeColorPickerOutside(e) {
            const wrapper = document.querySelector('.color-picker-wrapper');
            if (!wrapper.contains(e.target)) {
                document.getElementById('colorPickerPanel').classList.remove('show');
                document.removeEventListener('click', closeColorPickerOutside);
            }
        }

        function applyThemeColor(hex) {
            const root = document.documentElement;
            // 主色
            root.style.setProperty('--accent-purple', hex);
            root.style.setProperty('--accent-yellow', hex);
            // 亮色变体
            const lighter = lightenColor(hex, 40);
            const darker = darkenColor(hex, 30);
            root.style.setProperty('--accent-purple-light', lighter);
            root.style.setProperty('--accent-purple-dark', darker);
            // 发光效果
            root.style.setProperty('--glow-purple', `0 0 10px ${hex}80, 0 0 20px ${hex}4D`);
            root.style.setProperty('--glow-purple-intense', `0 0 15px ${hex}B3, 0 0 30px ${hex}66, 0 0 45px ${hex}33`);
            // 边框
            root.style.setProperty('--card-border', `${hex}4D`);
            root.style.setProperty('--card-border-hover', `${hex}99`);
            root.style.setProperty('--input-border', `${hex}66`);
            // 更新预设色高亮
            document.querySelectorAll('.color-swatch').forEach(s => {
                s.classList.toggle('active', s.dataset.color === hex);
            });
            // 更新自定义颜色输入
            document.getElementById('customColorInput').value = hex;
            // 保存到 localStorage
            localStorage.setItem('theme-accent', hex);
        }

        function lightenColor(hex, percent) {
            const num = parseInt(hex.replace('#', ''), 16);
            const r = Math.min(255, (num >> 16) + Math.round(255 * percent / 100));
            const g = Math.min(255, ((num >> 8) & 0x00FF) + Math.round(255 * percent / 100));
            const b = Math.min(255, (num & 0x0000FF) + Math.round(255 * percent / 100));
            return `#${(r << 16 | g << 8 | b).toString(16).padStart(6, '0')}`;
        }

        function darkenColor(hex, percent) {
            const num = parseInt(hex.replace('#', ''), 16);
            const r = Math.max(0, (num >> 16) - Math.round(255 * percent / 100));
            const g = Math.max(0, ((num >> 8) & 0x00FF) - Math.round(255 * percent / 100));
            const b = Math.max(0, (num & 0x0000FF) - Math.round(255 * percent / 100));
            return `#${(r << 16 | g << 8 | b).toString(16).padStart(6, '0')}`;
        }

        // 预设色点击事件
        document.querySelectorAll('.color-swatch').forEach(swatch => {
            swatch.addEventListener('click', () => {
                applyThemeColor(swatch.dataset.color);
            });
        });

        // 恢复保存的主题色
        (function restoreThemeColor() {
            const saved = localStorage.getItem('theme-accent');
            if (saved) applyThemeColor(saved);
        })();

        // --- 初始化启动 ---
        window.onload = init;
    </script>

    <!-- Toast 通知容器 -->
    <div id="toast-container"></div>

    <!-- 背景装饰光晕 3（动态补充 body::before/after 之外的第三个色调） -->
    <div class="bg-orb" style="width:350px;height:350px;background:radial-gradient(circle,rgba(48,209,88,0.08) 0%,transparent 70%);top:40%;right:15%;animation-duration:22s;animation-delay:-8s;"></div>
