    <script>
        // --- 1. 初始化数据与缓存机制 ---
        const CACHE_KEY = 'renovation_data_v1';
        
        // 状态管理
        let appliances = [];
        let filteredData = []; // 用于搜索筛选和排序后的数据
        let currentFilter = 'all'; // all, 待购, 付款, 完成
        let currentCategoryFilter = 'all'; // all, 硬装, 家电, 必要支出
        let currentSearch = '';
        let sortConfig = { key: null, isDesc: false }; // 恢复为默认手动排序，以便使用拖拽功能
        let hiddenColumns = new Set(); // 存储被隐藏的列 data-col 名字
        let columnWidths = {}; // 存储拖拽自定义的列宽
        
        // 云端同步配置
        let syncConfig = {
            provider: 'gitee', // 'gitee' or 'github'
            token: '',
            owner: 'lionel-wang',
            repo: 'zx-json',
            path: '装修预算.json',
            branch: 'gitee'
        };
        
        // 图表实例
        let barChartInstance = null;
        let doughnutChartInstance = null;

        // 默认数据
        const defaultData = [];

        let currentTab = 'table'; // 'table' or 'charts'

        function switchTab(tab) {
            currentTab = tab;
            
            // Update sidebar UI
            document.getElementById('tab-table').classList.toggle('active', tab === 'table');
            document.getElementById('tab-charts').classList.toggle('active', tab === 'charts');
            
            // Update content visibility
            document.getElementById('toolbarView').style.display = tab === 'table' ? 'flex' : 'none';
            document.getElementById('tableView').style.display = tab === 'table' ? 'block' : 'none';
            document.getElementById('chartsView').style.display = tab === 'charts' ? 'block' : 'none';

            if (tab === 'charts') {
                // Resize charts
                if (barChartInstance) barChartInstance.resize();
                if (doughnutChartInstance) doughnutChartInstance.resize();
            }
            
            // Save tab state (optional)
            localStorage.setItem(CACHE_KEY + '_current_tab', tab);
        }

        // 统一统计口径：
        // 1) 总预算：统计所有状态
        // 2) 实际支出：仅统计“完成/付款(兼容已付款)”
        // 3) 支持按分类汇总
        function calculateStatistics(items) {
            const stats = {
                totalBudget: 0,
                totalActual: 0,
                completedCount: 0,
                totalQuantity: 0,
                statusCount: { '待购': 0, '付款': 0, '完成': 0 },
                categoryStats: {}
            };

            items.forEach(item => {
                const category = item.category || '未分类';
                const budgetPrice = Number(item.budgetPrice) || 0;
                const actualPrice = Number(item.actualPrice) || 0;
                const quantity = Number(item.quantity) || 1;
                const status = item.status || '待购';
                const isActualCounted = status === '完成' || status === '付款' || status === '已付款';
                const isCompleted = status === '完成' || status === '已完成';

                stats.totalBudget += budgetPrice;
                if (isActualCounted) {
                    stats.totalActual += actualPrice;
                }
                if (isCompleted) {
                    stats.completedCount++;
                }
                stats.totalQuantity += quantity;

                if (status === '已付款') {
                    stats.statusCount['付款'] += 1;
                } else if (status === '已完成') {
                    stats.statusCount['完成'] += 1;
                } else {
                    stats.statusCount[status] = (stats.statusCount[status] || 0) + 1;
                }

                if (!stats.categoryStats[category]) {
                    stats.categoryStats[category] = {
                        totalBudget: 0,
                        totalActual: 0,
                        completedCount: 0,
                        totalQuantity: 0,
                        itemCount: 0
                    };
                }

                const categoryItem = stats.categoryStats[category];
                categoryItem.totalBudget += budgetPrice;
                if (isActualCounted) {
                    categoryItem.totalActual += actualPrice;
                }
                if (isCompleted) {
                    categoryItem.completedCount += 1;
                }
                categoryItem.totalQuantity += quantity;
                categoryItem.itemCount += 1;
            });

            return stats;
        }

        function init() {
            const cached = localStorage.getItem(CACHE_KEY);
            if (cached) {
                try {
                    appliances = JSON.parse(cached);
                } catch (e) {
                    appliances = JSON.parse(JSON.stringify(defaultData));
                }
            } else {
                appliances = JSON.parse(JSON.stringify(defaultData));
            }
            
            // 恢复自定义列宽
            const savedWidths = localStorage.getItem(CACHE_KEY + '_col_widths');
            if (savedWidths) {
                try {
                    columnWidths = JSON.parse(savedWidths);
                } catch(e) {}
            }
            
            // 兼容历史数据，迁移状态名称，添加默认优先度和排序字段
            appliances.forEach((item, index) => {
                if (item.status === '已完成') {
                    item.status = '完成';
                } else if (item.status === '已付款') {
                    item.status = '付款';
                }
                if (!item.priority) {
                    item.priority = '中'; // 默认优先度
                }
                if (typeof item.sortIndex === 'undefined') {
                    item.sortIndex = index; // 默认排序字段
                }
            });
            
            // 确保初始数据按 sortIndex 排序
            appliances.sort((a, b) => (a.sortIndex || 0) - (b.sortIndex || 0));
            
            // 初始化表头 UI 状态
            document.querySelectorAll('th.sortable').forEach(th => {
                th.classList.remove('active', 'desc');
                const thOnclick = th.getAttribute('onclick');
                if (thOnclick && thOnclick.includes(`'${sortConfig.key}'`)) {
                    th.classList.add('active');
                    if (sortConfig.isDesc) th.classList.add('desc');
                }
            });
            
            // 恢复图表折叠状态
            const savedTab = localStorage.getItem(CACHE_KEY + '_current_tab');
            if (savedTab) {
                switchTab(savedTab);
            } else {
                switchTab('table');
            }
            
            // 恢复隐藏列状态
            const savedHiddenCols = localStorage.getItem(CACHE_KEY + '_hidden_cols');
            if (savedHiddenCols) {
                try {
                    const parsedCols = JSON.parse(savedHiddenCols);
                    parsedCols.forEach(col => {
                        hiddenColumns.add(col);
                        const checkbox = document.querySelector(`.column-menu input[onchange="toggleColumn('${col}')"]`);
                        if (checkbox) checkbox.checked = false;
                    });
                } catch(e) {}
            }
            
            // 恢复 Gitee 配置
            const cachedSync = localStorage.getItem(CACHE_KEY + '_sync_config') || localStorage.getItem(CACHE_KEY + '_gitee_config') || localStorage.getItem(CACHE_KEY + '_github_config');
            if (cachedSync) {
                try {
                    syncConfig = { ...syncConfig, ...JSON.parse(cachedSync) };
                } catch(e) {
                    console.error('云端配置解析失败', e);
                }
            }
            
            // 滚动效果
            window.addEventListener('scroll', () => {
                const header = document.querySelector('header');
                if (window.scrollY > 10) header.classList.add('scrolled');
                else header.classList.remove('scrolled');
            });
            
            applyFiltersAndSort();
            initSortable();
            
            // 初始化列宽拖拽
            initResizableColumns();

            // 涟漪点击反馈
            initRipple();
        }

        // --- 列宽拖拽功能 ---
        function initResizableColumns() {
            let isResizing = false;
            let currentTh = null;
            let startX = 0;
            let startWidth = 0;
            let colName = '';

            const ths = document.querySelectorAll('th[data-col]');
            ths.forEach(th => {
                // 不给拖拽列添加手柄
                if (th.getAttribute('data-col') === 'drag') return;
                
                const handle = document.createElement('div');
                handle.className = 'resize-handle';
                th.appendChild(handle);

                const startDrag = function(e) {
                    isResizing = true;
                    currentTh = th;
                    colName = th.getAttribute('data-col');
                    startX = e.pageX || (e.touches && e.touches[0].pageX);
                    startWidth = th.offsetWidth;
                    handle.classList.add('active');
                    e.stopPropagation();
                    // 阻止默认行为可能会阻止手机滚动，对于表头手柄我们阻止它以防误触
                };

                handle.addEventListener('mousedown', startDrag);
                handle.addEventListener('touchstart', startDrag, { passive: true });
            });

            const onMove = function(e) {
                if (!isResizing || !currentTh) return;
                const pageX = e.pageX || (e.touches && e.touches[0].pageX);
                const diff = pageX - startX;
                const newWidth = Math.max(40, startWidth + diff); // 最小宽度 40px
                
                // 实时更新当前列宽
                columnWidths[colName] = newWidth;
                
                // 更新样式
                currentTh.style.width = newWidth + 'px';
                currentTh.style.minWidth = newWidth + 'px';
                currentTh.style.maxWidth = newWidth + 'px';
                
                const tds = document.querySelectorAll(`td[data-col="${colName}"]`);
                tds.forEach(td => {
                    td.style.width = newWidth + 'px';
                    td.style.minWidth = newWidth + 'px';
                    td.style.maxWidth = newWidth + 'px';
                });
            };

            const onEnd = function() {
                if (isResizing) {
                    isResizing = false;
                    if (currentTh) {
                        const handle = currentTh.querySelector('.resize-handle');
                        if (handle) handle.classList.remove('active');
                        currentTh = null;
                        
                        // 拖拽结束后保存到本地
                        localStorage.setItem(CACHE_KEY + '_col_widths', JSON.stringify(columnWidths));
                    }
                }
            };

            document.addEventListener('mousemove', onMove);
            document.addEventListener('touchmove', onMove, { passive: true });
            document.addEventListener('mouseup', onEnd);
            document.addEventListener('touchend', onEnd);
        }

        function saveToCache() {
            localStorage.setItem(CACHE_KEY, JSON.stringify(appliances));
        }

        function toggleColumnMenu() {
            const menu = document.getElementById('columnMenu');
            menu.style.display = menu.style.display === 'none' ? 'flex' : 'none';
        }

        // 点击页面其他地方关闭列筛选菜单
        document.addEventListener('click', (e) => {
            const filter = document.getElementById('columnFilter');
            const menu = document.getElementById('columnMenu');
            if (filter && menu && !filter.contains(e.target)) {
                menu.style.display = 'none';
            }
        });

        function toggleColumn(col) {
            if (hiddenColumns.has(col)) {
                hiddenColumns.delete(col);
            } else {
                hiddenColumns.add(col);
            }
            localStorage.setItem(CACHE_KEY + '_hidden_cols', JSON.stringify(Array.from(hiddenColumns)));
            applyFiltersAndSort();
        }

        // --- 数据处理层 (过滤与排序) ---
        function setFilter(status) {
            currentFilter = status;
            // 更新按钮UI
            document.querySelectorAll('#statusFilter .filter-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.status === status);
            });
            applyFiltersAndSort();
        }

        function setCategoryFilter(category) {
            currentCategoryFilter = category;
            document.querySelectorAll('#categoryFilter .filter-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.category === category);
            });
            applyFiltersAndSort();
        }

        function handleFilter() {
            currentSearch = document.getElementById('searchInput').value.toLowerCase();
            applyFiltersAndSort();
        }

        function handleSort(key) {
            if (sortConfig.key === key) {
                if (sortConfig.isDesc) {
                    sortConfig.key = null; // 取消排序
                } else {
                    sortConfig.isDesc = true; // 切换为降序
                }
            } else {
                sortConfig.key = key;
                sortConfig.isDesc = false; // 默认升序
            }
            
            // 更新表头 UI
            document.querySelectorAll('th.sortable').forEach(th => {
                th.classList.remove('active', 'desc');
                const thOnclick = th.getAttribute('onclick');
                if (thOnclick.includes(`'${key}'`)) {
                    if (sortConfig.key) {
                        th.classList.add('active');
                        if (sortConfig.isDesc) th.classList.add('desc');
                    }
                }
            });

            applyFiltersAndSort();
        }

        function applyFiltersAndSort() {
            // 1. 过滤
            filteredData = appliances.filter(item => {
                const matchStatus = currentFilter === 'all' || item.status === currentFilter;
                const matchCategory = currentCategoryFilter === 'all' || item.category === currentCategoryFilter;
                const searchTarget = `${item.name} ${item.category} ${item.brand} ${item.notes}`.toLowerCase();
                const matchSearch = currentSearch === '' || searchTarget.includes(currentSearch);
                return matchStatus && matchCategory && matchSearch;
            });

            // 2. 排序
            if (sortConfig.key) {
                filteredData.sort((a, b) => {
                    let valA = a[sortConfig.key];
                    let valB = b[sortConfig.key];
                    
                    // 数字排序
                    if (['budgetPrice', 'actualPrice', 'diffPrice'].includes(sortConfig.key)) {
                        if (sortConfig.key === 'diffPrice') {
                            valA = (Number(a.budgetPrice) || 0) - (Number(a.actualPrice) || 0);
                            valB = (Number(b.budgetPrice) || 0) - (Number(b.actualPrice) || 0);
                        } else {
                            valA = Number(valA) || 0;
                            valB = Number(valB) || 0;
                        }
                        return sortConfig.isDesc ? valB - valA : valA - valB;
                    }
                    
                    // 状态排序映射优先级
                    if (sortConfig.key === 'status') {
                        const statusWeight = { '完成': 3, '付款': 2, '待购': 1 };
                        valA = statusWeight[valA] || 0;
                        valB = statusWeight[valB] || 0;
                        return sortConfig.isDesc ? valB - valA : valA - valB;
                    }

                    // 优先度排序映射优先级
                    if (sortConfig.key === 'priority') {
                        const priorityWeight = { '高': 3, '中': 2, '低': 1 };
                        valA = priorityWeight[valA] || 0;
                        valB = priorityWeight[valB] || 0;
                        return sortConfig.isDesc ? valB - valA : valA - valB;
                    }

                    // 字符串排序
                    valA = String(valA || '');
                    valB = String(valB || '');
                    return sortConfig.isDesc ? valB.localeCompare(valA) : valA.localeCompare(valB);
                });
            } else {
                // 如果没有手动点击表头排序，则按 sortIndex 排序
                filteredData.sort((a, b) => (a.sortIndex || 0) - (b.sortIndex || 0));
            }

            render();
        }

        // --- 渲染引擎 ---
        function render() {
            const tbody = document.getElementById('table-body');
            const emptyState = document.getElementById('empty-state');
            tbody.innerHTML = '';

            const stats = calculateStatistics(filteredData);
            const totalBudget = stats.totalBudget;
            const totalActual = stats.totalActual;
            const completedCount = stats.completedCount;
            
            // 图表数据收集
            let chartLabels = [];
            let chartBudgets = [];
            let chartActuals = [];
            const statusCount = stats.statusCount;

            if (filteredData.length === 0) {
                emptyState.style.display = 'block';
                document.querySelector('table').style.display = 'none';
            } else {
                emptyState.style.display = 'none';
                document.querySelector('table').style.display = 'table';
                
                // 应用列隐藏样式和列宽
                document.querySelectorAll('th[data-col]').forEach(th => {
                    const colName = th.getAttribute('data-col');
                    if (hiddenColumns.has(colName)) {
                        th.style.display = 'none';
                    } else {
                        th.style.display = 'table-cell'; // 覆盖可能存在的移动端 CSS 隐藏
                        if (columnWidths[colName]) {
                            th.style.width = columnWidths[colName] + 'px';
                            th.style.minWidth = columnWidths[colName] + 'px';
                            th.style.maxWidth = columnWidths[colName] + 'px';
                        }
                    }
                });

                filteredData.forEach((item, index) => {
                    const bPrice = Number(item.budgetPrice) || 0;
                    const aPrice = Number(item.actualPrice) || 0;
                    const diffPrice = bPrice - aPrice;
                    
                    // 取前 15 项数据渲染柱状图（避免图表太挤）
                    if (index < 15) {
                        chartLabels.push(item.name ? (item.name.length > 6 ? item.name.substring(0, 6) + '...' : item.name) : '未命名');
                        chartBudgets.push(bPrice);
                        chartActuals.push(aPrice);
                    }
                    
                    // 判断超预算 (实际 > 预算，且预算不为0)
                    const isOverBudget = bPrice > 0 && aPrice > bPrice;

                    let diffHtml = '';
                    if (item.status === '待购') {
                        diffHtml = `<span style="color: var(--text-secondary); font-weight: 500;">-</span>`;
                    } else if (diffPrice < 0) {
                        diffHtml = `<span style="color: var(--accent-red); font-weight: 600;">${diffPrice.toLocaleString()}</span>`;
                    } else if (diffPrice > 0) {
                        diffHtml = `<span style="color: var(--accent-green); font-weight: 600;">+${diffPrice.toLocaleString()}</span>`;
                    } else {
                        diffHtml = `<span style="color: var(--text-secondary); font-weight: 600;">0</span>`;
                    }

                    // 状态徽章映射
                    let statusClass = 'status-pending';
                    if (item.status === '完成') statusClass = 'status-done';
                    if (item.status === '付款') statusClass = 'status-paid';
                    
                    // 优先度映射
                    let priorityColor = 'var(--text-secondary)';
                    if (item.priority === '高') priorityColor = 'var(--accent-red)';
                    else if (item.priority === '中') priorityColor = 'var(--accent-orange)';

                    const tr = document.createElement('tr');
                    tr.setAttribute('data-id', item.id);
                    if (isOverBudget) tr.classList.add('row-over-budget');
                    
                    // 如果正在点击表头排序，隐藏拖拽手柄（避免破坏原数组顺序）
                    const canDrag = sortConfig.key === null;
                    const dragHtml = canDrag 
                        ? `<div class="drag-handle"><i class="ph ph-list"></i></div>` 
                        : `<div style="width:20px;"></div>`;

                    tr.innerHTML = `
                        <td data-col="drag">${dragHtml}</td>
                        <td data-col="name" style="font-weight: 600; color: var(--text-primary);" title="${item.name || '-'}">${item.name || '-'}</td>
                        <td data-col="priority" style="color: ${priorityColor}; font-weight: 600;">${item.priority || '-'}</td>
                        <td data-col="category" style="color: var(--text-secondary);">${item.category || '-'}</td>
                        <td data-col="brand" style="color: var(--text-secondary);">${item.brand || '-'}</td>
                        <td data-col="quantity" style="color: var(--text-secondary);">${item.quantity || 1}</td>
                        <td data-col="budgetPrice" title="¥${bPrice.toLocaleString()}">¥${bPrice.toLocaleString()}</td>
                        <td data-col="actualPrice" style="font-weight: 600;" title="¥${aPrice.toLocaleString()}">¥${aPrice.toLocaleString()} ${isOverBudget ? '<i class="ph-fill ph-warning-circle" style="color: var(--accent-red); margin-left: 4px;"></i>' : ''}</td>
                        <td data-col="diffPrice" title="¥${diffPrice.toLocaleString()}">${diffHtml}</td>
                        <td data-col="channel" style="color: var(--text-secondary);">${item.purchaseChannel || '-'}</td>
                        <td data-col="status"><span class="status-badge ${statusClass}" title="${item.status}">${item.status}</span></td>
                        <td data-col="notes" style="color: var(--text-secondary); font-size: 13px; max-width: 200px;">
                            <div style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis;" title="${item.notes || ''}">
                                ${item.notes || '-'}
                            </div>
                        </td>
                        <td data-col="actions" style="text-align: center; white-space: nowrap;">
                            <button class="btn btn-ghost" onclick="editData(${item.id})"><i class="ph ph-pencil-simple"></i></button>
                            <button class="btn btn-ghost btn-danger" onclick="deleteData(${item.id})"><i class="ph ph-trash"></i></button>
                        </td>
                    `;
                    
                    // 新增渲染后再次根据 hiddenColumns 隐藏 td，避免新行闪烁
                    // 并且应用保存的列宽
                    tr.querySelectorAll('td[data-col]').forEach(el => {
                        const colName = el.getAttribute('data-col');
                        if (hiddenColumns.has(colName)) {
                            el.style.display = 'none';
                        } else {
                            el.style.display = 'table-cell'; // 覆盖移动端 CSS
                            if (columnWidths[colName]) {
                                el.style.width = columnWidths[colName] + 'px';
                                el.style.minWidth = columnWidths[colName] + 'px';
                                el.style.maxWidth = columnWidths[colName] + 'px';
                            }
                        }
                    });

                    tbody.appendChild(tr);
                });
            }

            // 更新统计面板
            const diff = totalBudget - totalActual;
            const rate = filteredData.length > 0 ? Math.round((completedCount / filteredData.length) * 100) : 0;

            // 数字滚动动画工具函数
            animateValue(document.getElementById('stat-budget'), totalBudget);
            animateValue(document.getElementById('stat-actual'), totalActual);

            const diffEl = document.getElementById('stat-diff');
            const cardDiff = document.getElementById('card-diff');
            animateValue(diffEl, diff, true);

            if (diff < 0) {
                cardDiff.className = 'stat-card card-red over-budget';
                document.getElementById('stat-diff-sub').innerText = '已超出预算，请注意控制';
            } else if (diff > 0) {
                cardDiff.className = 'stat-card card-green positive';
                document.getElementById('stat-diff-sub').innerText = '预算内，状况良好';
            } else {
                cardDiff.className = 'stat-card card-green';
                document.getElementById('stat-diff-sub').innerText = '预算与实际持平';
            }

            document.getElementById('stat-rate').innerText = rate + '%';

            // 总体超预算卡片高亮
            const cardActual = document.getElementById('card-actual');
            if (totalActual > totalBudget && totalBudget > 0) {
                cardActual.classList.add('over-budget');
            } else {
                cardActual.classList.remove('over-budget');
            }

            // 更新导航徽章计数
            document.getElementById('nav-count').innerText = filteredData.length;

            // 更新分类迷你卡片
            const catContainer = document.getElementById('category-mini-cards');
            if (catContainer) {
                const cats = stats.categoryStats;
                const catColors = {
                    '硬装': 'var(--accent-blue)',
                    '家电': 'var(--accent-teal)',
                    '必要支出': 'var(--accent-orange)',
                    '软装': 'var(--accent-purple)'
                };
                catContainer.innerHTML = Object.entries(cats).slice(0, 4).map(([name, cs]) => {
                    const color = catColors[name] || 'var(--text-secondary)';
                    const catRate = cs.itemCount > 0 ? Math.round((cs.completedCount / cs.itemCount) * 100) : 0;
                    return `<div style="background: rgba(255,255,255,0.03); border-radius: 10px; padding: 8px 14px; min-width: 80px; text-align: center; border: 1px solid rgba(255,255,255,0.04);">
                        <div style="font-size: 10px; color: var(--text-tertiary); text-transform: uppercase; letter-spacing: 0.03em; margin-bottom: 2px;">${name}</div>
                        <div style="font-size: 18px; font-weight: 680; color: ${color}; font-variant-numeric: tabular-nums;">${catRate}%</div>
                        <div style="font-size: 10px; color: var(--text-quaternary);">${cs.completedCount}/${cs.itemCount} 完成</div>
                    </div>`;
                }).join('');
            }
            
            // 更新图表
            updateCharts(chartLabels, chartBudgets, chartActuals, statusCount);

            saveToCache();
        }
        
        // --- 渲染图表 ---
        function updateCharts(labels, budgets, actuals, statusCount) {
            // Chart.js 全局配置 (适配暗色模式)
            Chart.defaults.color = '#86868B';
            Chart.defaults.font.family = '-apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif';
            
            // 1. 柱状图: 预算 vs 实际
            const barCtx = document.getElementById('barChart').getContext('2d');
            
            if (barChartInstance) barChartInstance.destroy();
            
            barChartInstance = new Chart(barCtx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [
                        {
                            label: '预算金额',
                            data: budgets,
                            backgroundColor: budgets.map(() => 'rgba(10, 132, 255, 0.15)'),
                            borderColor: '#0A84FF',
                            borderWidth: 2,
                            borderRadius: 6,
                            barPercentage: 0.55,
                            categoryPercentage: 0.8
                        },
                        {
                            label: '实际支出',
                            data: actuals,
                            backgroundColor: actuals.map((a, i) => a > budgets[i] && budgets[i] > 0 ? 'rgba(255, 69, 58, 0.6)' : 'rgba(48, 209, 88, 0.6)'),
                            borderColor: actuals.map((a, i) => a > budgets[i] && budgets[i] > 0 ? '#FF453A' : '#30D158'),
                            borderWidth: 2,
                            borderRadius: 6,
                            barPercentage: 0.55,
                            categoryPercentage: 0.8
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    animation: {
                        duration: 800,
                        easing: 'easeOutQuart'
                    },
                    plugins: {
                        legend: {
                            position: 'top',
                            align: 'end',
                            labels: { boxWidth: 12, usePointStyle: true, padding: 20 }
                        },
                        tooltip: {
                            backgroundColor: 'rgba(28, 28, 30, 0.9)',
                            titleColor: '#FFF',
                            bodyColor: '#F5F5F7',
                            borderColor: 'rgba(255,255,255,0.1)',
                            borderWidth: 1,
                            padding: 12,
                            boxPadding: 6,
                            usePointStyle: true,
                            callbacks: {
                                label: function(context) {
                                    let label = context.dataset.label || '';
                                    if (label) label += ': ';
                                    if (context.parsed.y !== null) {
                                        label += new Intl.NumberFormat('zh-CN', { style: 'currency', currency: 'CNY' }).format(context.parsed.y);
                                    }
                                    return label;
                                }
                            }
                        }
                    },
                    scales: {
                        x: {
                            grid: { display: false, drawBorder: false }
                        },
                        y: {
                            beginAtZero: true,
                            grid: { color: 'rgba(255, 255, 255, 0.05)', drawBorder: false },
                            ticks: {
                                callback: function(value) {
                                    return value >= 1000 ? (value/1000) + 'k' : value;
                                }
                            }
                        }
                    }
                }
            });

            // 2. 环形图: 状态分布
            const donutCtx = document.getElementById('doughnutChart').getContext('2d');
            
            if (doughnutChartInstance) doughnutChartInstance.destroy();
            
            const totalStatus = statusCount['待购'] + statusCount['付款'] + statusCount['完成'];
            
            doughnutChartInstance = new Chart(donutCtx, {
                type: 'doughnut',
                data: {
                    labels: ['待购', '付款', '完成'],
                    datasets: [{
                        data: totalStatus === 0 ? [1, 0, 0] : [statusCount['待购'], statusCount['付款'], statusCount['完成']],
                        backgroundColor: [
                            'rgba(10, 132, 255, 0.7)',
                            'rgba(255, 159, 10, 0.7)',
                            'rgba(48, 209, 88, 0.7)'
                        ],
                        borderColor: [
                            'rgba(10, 132, 255, 0.3)',
                            'rgba(255, 159, 10, 0.3)',
                            'rgba(48, 209, 88, 0.3)'
                        ],
                        borderWidth: 2,
                        hoverOffset: 8
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    cutout: '72%',
                    animation: {
                        animateScale: true,
                        animateRotate: true,
                        duration: 1000,
                        easing: 'easeOutQuart'
                    },
                    plugins: {
                        legend: {
                            position: 'bottom',
                            labels: { padding: 20, usePointStyle: true, boxWidth: 10 }
                        },
                        tooltip: {
                            backgroundColor: 'rgba(28, 28, 30, 0.9)',
                            padding: 12,
                            usePointStyle: true,
                            callbacks: {
                                label: function(context) {
                                    if (totalStatus === 0) return ' 暂无数据';
                                    const value = context.raw;
                                    const percentage = Math.round((value / totalStatus) * 100);
                                    return ` ${context.label}: ${value} 项 (${percentage}%)`;
                                }
                            }
                        }
                    }
                },
                plugins: [{
                    id: 'centerText',
                    beforeDraw: function(chart) {
                        if (totalStatus === 0) return;
                        var width = chart.width,
                            height = chart.height,
                            ctx = chart.ctx;
                
                        ctx.restore();
                        var fontSize = (height / 120).toFixed(2);
                        ctx.font = "600 " + fontSize + "em -apple-system, BlinkMacSystemFont, sans-serif";
                        ctx.textBaseline = "middle";
                        ctx.fillStyle = "#F5F5F7";
                
                        var text = totalStatus,
                            textX = Math.round((width - ctx.measureText(text).width) / 2),
                            textY = height / 2 - 10;
                
                        ctx.fillText(text, textX, textY);
                        
                        ctx.font = "500 " + (fontSize * 0.4).toFixed(2) + "em -apple-system, sans-serif";
                        ctx.fillStyle = "#86868B";
                        var labelText = "总项目数",
                            labelX = Math.round((width - ctx.measureText(labelText).width) / 2),
                            labelY = height / 2 + 15;
                            
                        ctx.fillText(labelText, labelX, labelY);
                        ctx.save();
                    }
                }]
            });
        }

        // 数字增长动画（增强版：弹性回弹 + 数字 pop 动效）
        function animateValue(obj, end, isDiff = false) {
            const duration = 700;
            const start = Number(obj.innerText.replace(/[^0-9.-]+/g,"")) || 0;
            if (start === end) return;

            const range = end - start;
            let startTime = null;

            // 触发数字弹跳动效
            obj.classList.remove('value-pop');
            void obj.offsetWidth; // reflow
            obj.classList.add('value-pop');

            const step = (timestamp) => {
                if (!startTime) startTime = timestamp;
                const progress = Math.min((timestamp - startTime) / duration, 1);
                // Ease out back: 略微超过终点再回弹，增强弹性感
                const c1 = 1.70158;
                const c3 = c1 + 1;
                const easeProgress = 1 + c3 * Math.pow(progress - 1, 3) + c1 * Math.pow(progress - 1, 2);

                let currentVal = Math.floor(start + (range * easeProgress));
                if (progress === 1) currentVal = end;

                obj.innerText = (isDiff && currentVal > 0 ? '+' : '') + currentVal.toLocaleString();

                if (progress < 1) window.requestAnimationFrame(step);
            };
            window.requestAnimationFrame(step);
        }

        // Toast 通知
        function showToast(message, type = 'info', duration = 3000) {
            const container = document.getElementById('toast-container');
            const icons = { success: 'ph-check-circle', error: 'ph-warning-circle', info: 'ph-info' };
            const icon = icons[type] || icons.info;

            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.innerHTML = `<i class="ph ${icon}"></i><span>${message}</span>`;
            container.appendChild(toast);

            // 触发入场动画
            requestAnimationFrame(() => {
                toast.classList.add('show');
            });

            // 自动移除
            setTimeout(() => {
                toast.classList.remove('show');
                toast.classList.add('hide');
                setTimeout(() => {
                    if (toast.parentNode) toast.parentNode.removeChild(toast);
                }, 400);
            }, duration);
        }

        // 涟漪点击反馈
        function initRipple() {
            document.querySelectorAll('.btn').forEach(btn => {
                // 跳过已有 ripper-container 的按钮
                if (btn.querySelector('.ripple-container')) return;

                const container = document.createElement('span');
                container.className = 'ripple-container';
                btn.appendChild(container);

                btn.addEventListener('mousedown', function(e) {
                    const rect = btn.getBoundingClientRect();
                    const size = Math.max(rect.width, rect.height);
                    const x = e.clientX - rect.left - size / 2;
                    const y = e.clientY - rect.top - size / 2;

                    ripple.style.width = ripple.style.height = size + 'px';

                    });
                });

        // --- 4. 拖拽排序 ---
        function initSortable() {
            const tbody = document.getElementById('table-body');
            new Sortable(tbody, {
                handle: '.drag-handle',
                animation: 250,
                easing: "cubic-bezier(0.25, 0.8, 0.25, 1)",
                ghostClass: 'sortable-ghost',
                dragClass: 'sortable-drag',
                onEnd: function (evt) {
                    // 只有在非点击表头排序的情况下才处理拖拽结果
                    if (sortConfig.key !== null) return;

                    const draggedItemIndex = evt.oldIndex;
                    const targetItemIndex = evt.newIndex;
                    
                    if (draggedItemIndex === targetItemIndex) return;

                    // 获取当前表格展示的数据（filteredData）
                    const draggedItem = filteredData[draggedItemIndex];
                    const targetItem = filteredData[targetItemIndex];

                    if (!draggedItem || !targetItem) return;

                    // 获取它们在全局 appliances 数组中的真实索引位置
                    const globalOldIndex = appliances.findIndex(a => a.id === draggedItem.id);
                    const globalNewIndex = appliances.findIndex(a => a.id === targetItem.id);

                    if (globalOldIndex > -1 && globalNewIndex > -1) {
                        // 在全局数组中移动元素
                        const item = appliances.splice(globalOldIndex, 1)[0];
                        
                        // 调整插入位置：
                        // 如果是向下拖拽，应该插入到目标元素的后面
                        // 如果是向上拖拽，应该插入到目标元素的前面
                        const insertIndex = globalOldIndex < globalNewIndex ? globalNewIndex : globalNewIndex;
                        appliances.splice(insertIndex, 0, item);

                        // 重新分配 sortIndex 保持与物理顺序一致
                        appliances.forEach((a, idx) => {
                            a.sortIndex = idx;
                        });

                        saveToCache(); 
                        
                        // 重新应用过滤和渲染以确保 DOM 和数据完全一致
                        applyFiltersAndSort();
                    }
                }
            });
        }

        // 推送到云端
        async function pushToCloud() {
            if (!syncConfig.token) {
                showToast('请先配置私人令牌(Token)', 'error');
                openSettingsModal();
                return;
            }

            if (!confirm('这将会把当前本地的所有数据覆盖到云端仓库中，是否继续？')) return;

            const btn = document.querySelector('button[onclick="pushToCloud()"]');
            const originalText = btn.innerHTML;
            
            try {
                btn.innerHTML = '<i class="ph ph-spinner ph-spin" style="font-size: 16px;"></i> 推送中';
                btn.style.opacity = '0.7';
                btn.style.pointerEvents = 'none';

                const stats = calculateStatistics(appliances);
                const exportData = {
                    exportTime: new Date().toLocaleString('zh-CN', { hour12: false }),
                    appliances: appliances,
                    statistics: {
                        totalBudget: stats.totalBudget,
                        totalActual: stats.totalActual,
                        budgetDifference: stats.totalBudget - stats.totalActual,
                        totalQuantity: stats.totalQuantity,
                        completedCount: stats.completedCount,
                        completionRate: appliances.length > 0 ? Math.round((stats.completedCount / appliances.length) * 100) : 0,
                        categoryStats: stats.categoryStats
                    }
                };

                const contentBase64 = btoa(unescape(encodeURIComponent(JSON.stringify(exportData, null, 2))));
                const isGithub = syncConfig.provider === 'github';
                
                const apiUrl = isGithub
                    ? `https://api.github.com/repos/${syncConfig.owner}/${syncConfig.repo}/contents/${encodeURIComponent(syncConfig.path)}`
                    : `https://gitee.com/api/v5/repos/${syncConfig.owner}/${syncConfig.repo}/contents/${encodeURIComponent(syncConfig.path)}`;

                // 2. 获取当前主文件的 SHA
                let currentSha = null;
                let oldContentBase64 = null;
                try {
                    const getUrl = isGithub
                        ? `${apiUrl}?ref=${syncConfig.branch}&t=${new Date().getTime()}`
                        : `${apiUrl}?ref=${syncConfig.branch}&access_token=${syncConfig.token}&t=${new Date().getTime()}`;
                    
                    const headers = isGithub ? {
                        'Authorization': `token ${syncConfig.token}`,
                        'Accept': 'application/vnd.github.v3+json'
                    } : {};

                    const getRes = await fetch(getUrl, { headers });
                    if (getRes.ok) {
                        const fileData = await getRes.json();
                        currentSha = fileData.sha;
                        oldContentBase64 = fileData.content;
                    }
                } catch (e) {
                    console.error('获取文件SHA失败', e);
                }
                
                // 3. 备份历史记录
                if (currentSha && oldContentBase64) {
                    try {
                        const d = new Date();
                        const timeStr = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}_${String(d.getHours()).padStart(2, '0')}-${String(d.getMinutes()).padStart(2, '0')}-${String(d.getSeconds()).padStart(2, '0')}`;
                        
                        const pathParts = syncConfig.path.split('/');
                        pathParts.pop(); 
                        const backupDir = pathParts.length > 0 ? `history/${pathParts.join('/')}` : 'history';
                        const backupPath = `${backupDir}/${timeStr}.json`;
                        
                        const backupApiUrl = isGithub
                            ? `https://api.github.com/repos/${syncConfig.owner}/${syncConfig.repo}/contents/${encodeURIComponent(backupPath)}`
                            : `https://gitee.com/api/v5/repos/${syncConfig.owner}/${syncConfig.repo}/contents/${encodeURIComponent(backupPath)}`;
                        
                        const backupBody = {
                            message: `Auto backup before update - ${timeStr}`,
                            content: oldContentBase64,
                            branch: syncConfig.branch
                        };
                        if (!isGithub) backupBody.access_token = syncConfig.token;

                        await fetch(backupApiUrl, {
                            method: isGithub ? 'PUT' : 'POST',
                            headers: isGithub ? {
                                'Authorization': `token ${syncConfig.token}`,
                                'Content-Type': 'application/json'
                            } : {
                                'Content-Type': 'application/json'
                            },
                            body: JSON.stringify(backupBody)
                        });
                    } catch (backupErr) {
                        console.error('备份请求异常', backupErr);
                    }
                }

                // 4. 执行更新或创建
                const bodyData = {
                    message: `Update budget via Web App - ${new Date().toLocaleString()}`,
                    content: contentBase64,
                    branch: syncConfig.branch
                };
                if (!isGithub) bodyData.access_token = syncConfig.token;
                if (currentSha) bodyData.sha = currentSha;

                const method = isGithub ? 'PUT' : (currentSha ? 'PUT' : 'POST');
                const headers = isGithub ? {
                    'Authorization': `token ${syncConfig.token}`,
                    'Accept': 'application/vnd.github.v3+json',
                    'Content-Type': 'application/json'
                } : {
                    'Content-Type': 'application/json'
                };

                const putRes = await fetch(apiUrl, {
                    method: method,
                    headers: headers,
                    body: JSON.stringify(bodyData)
                });

                if (!putRes.ok) {
                    const errorMsg = await putRes.text();
                    throw new Error(`Cloud API Error: ${putRes.status} ${errorMsg}`);
                }

                alert('🚀 成功推送到云端仓库！');
            } catch (err) {
                console.error("推送失败", err);
                alert(`推送失败，请检查 Token 权限、仓库名及路径是否正确。\n\n错误信息：${err.message}`);
            } finally {
                btn.innerHTML = originalText;
                btn.style.opacity = '1';
                btn.style.pointerEvents = 'auto';
            }
        }

        async function syncFromCloud() {
            if (!confirm('从云端同步将覆盖当前本地所有数据，并且不可恢复。\n请确认云端数据是最新的！是否继续？')) {
                return;
            }

            if (!syncConfig.token) {
                showToast('请先配置私人令牌(Token)', 'error');
                openSettingsModal();
                return;
            }

            const isGithub = syncConfig.provider === 'github';
            const apiUrl = isGithub
                ? `https://api.github.com/repos/${syncConfig.owner}/${syncConfig.repo}/contents/${encodeURIComponent(syncConfig.path)}?ref=${syncConfig.branch}&t=${new Date().getTime()}`
                : `https://gitee.com/api/v5/repos/${syncConfig.owner}/${syncConfig.repo}/contents/${encodeURIComponent(syncConfig.path)}?ref=${syncConfig.branch}&access_token=${syncConfig.token}&t=${new Date().getTime()}`;
            
            const headers = isGithub ? {
                'Authorization': `token ${syncConfig.token}`,
                'Accept': 'application/vnd.github.v3+json'
            } : {};

            const btn = document.querySelector('button[onclick="syncFromCloud()"]');
            const originalText = btn.innerHTML;
            
            try {
                btn.innerHTML = '<i class="ph ph-spinner ph-spin"></i> 同步中...';
                btn.style.opacity = '0.7';
                btn.style.pointerEvents = 'none';

                const response = await fetch(apiUrl, { headers });
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                const fileData = await response.json();
                if (!fileData.content) {
                    throw new Error('未找到文件内容，可能是路径错误或空文件。');
                }

                // Base64 解码 utf-8
                const jsonStr = decodeURIComponent(escape(atob(fileData.content)));
                const importedData = JSON.parse(jsonStr);
                
                if (importedData.appliances && Array.isArray(importedData.appliances)) {
                    let addedCount = 0;
                    let updatedCount = 0;
                    let deletedCount = 0;
                    
                    const localDataMap = new Map(appliances.map(item => [item.id, item]));
                    const cloudDataMap = new Map(importedData.appliances.map(item => [item.id, item]));
                    
                    importedData.appliances.forEach(cloudItem => {
                        if (!localDataMap.has(cloudItem.id)) {
                            addedCount++;
                        } else {
                            const localItemStr = JSON.stringify(localDataMap.get(cloudItem.id));
                            const cloudItemStr = JSON.stringify(cloudItem);
                            if (localItemStr !== cloudItemStr) {
                                updatedCount++;
                            }
                        }
                    });
                    
                    appliances.forEach(localItem => {
                        if (!cloudDataMap.has(localItem.id)) {
                            deletedCount++;
                        }
                    });

                    appliances = importedData.appliances;
                    
                    currentFilter = 'all';
                    currentSearch = '';
                    sortConfig = { key: null, isDesc: false };
                    document.getElementById('searchInput').value = '';
                    document.querySelectorAll('.filter-btn').forEach(b => b.classList.toggle('active', b.dataset.status === 'all'));
                    
                    applyFiltersAndSort();
                    
                    if (addedCount === 0 && updatedCount === 0 && deletedCount === 0) {
                        alert('🎉 云端同步成功！\n\n云端数据与本地完全一致，没有发生任何变更。');
                    } else {
                        alert(`🎉 云端同步成功！\n\n数据变更详情：\n✨ 新增：${addedCount} 条\n📝 修改：${updatedCount} 条\n🗑️ 删除：${deletedCount} 条`);
                    }
                } else {
                    throw new Error('文件格式错误：未找到 appliances 数组。');
                }
            } catch (err) {
                console.error("同步失败", err);
                alert(`云端同步失败，请检查网络或文件地址是否正确。\n\n错误信息：${err.message}`);
            } finally {
                btn.innerHTML = originalText;
                btn.style.opacity = '1';
                btn.style.pointerEvents = 'auto';
            }
        }

        // --- 6. 高级 Excel 导出 (保持样式) ---
        function exportExcel() {

            const dataToExport = filteredData.length > 0 || currentFilter !== 'all' || currentSearch !== '' ? filteredData : appliances;

            if (dataToExport.length === 0) {
                return alert('没有可导出的数据！');
            }

            // 1. 获取全局统计数据
            const stats = calculateStatistics(dataToExport);

            // 2. 构造二维数组 (AOA)
            const aoa = [];
            
            // --- A. 添加全局总计汇总区域 ---
            aoa.push(["【总计汇总】"]);
            aoa.push(["总预算(¥)", "实际支出(¥)", "预算差额(¥)", "完成率(%)", "总项目数"]);
            const completionRate = dataToExport.length > 0 ? Math.round((stats.completedCount / dataToExport.length) * 100) : 0;
            const diffPrice = stats.totalBudget - stats.totalActual;
            aoa.push([
                stats.totalBudget, 
                stats.totalActual, 
                diffPrice > 0 ? `+${diffPrice}` : diffPrice, 
                `${completionRate}%`, 
                dataToExport.length
            ]);
            aoa.push([]); // 空行分隔

            // --- B. 添加分类汇总区域 ---
            aoa.push(["【分类汇总】"]);
            aoa.push(["分类", "总预算(¥)", "实际支出(¥)", "完成度", "项目数"]);
            Object.keys(stats.categoryStats).forEach(cat => {
                const cStats = stats.categoryStats[cat];
                aoa.push([
                    cat,
                    cStats.totalBudget,
                    cStats.totalActual,
                    `${cStats.completedCount} / ${cStats.itemCount}`,
                    cStats.itemCount
                ]);
            });
            aoa.push([]); // 空行分隔

            // --- C. 添加明细数据区域 ---
            aoa.push(["【预算明细清单】"]);
            const detailStartRowIndex = aoa.length; // 记录明细数据表头的所在行索引（从0开始）
            const headers = ["名称", "优先度", "分类", "品牌", "数量", "预算金额(¥)", "实际金额(¥)", "差额(¥)", "购买渠道", "状态", "备注"];
            aoa.push(headers);

            dataToExport.forEach(item => {
                const bPrice = Number(item.budgetPrice) || 0;
                const aPrice = Number(item.actualPrice) || 0;
                const itemDiffPrice = item.status === '待购' ? '-' : (bPrice - aPrice);

                aoa.push([
                    item.name || '',
                    item.priority || '',
                    item.category || '',
                    item.brand || '',
                    item.quantity || 1,
                    bPrice,
                    aPrice,
                    itemDiffPrice,
                    item.purchaseChannel || '',
                    item.status || '',
                    item.notes || ''
                ]);
            });

            // 3. 创建工作簿和工作表
            const wb = XLSX.utils.book_new();
            const ws = XLSX.utils.aoa_to_sheet(aoa);

            // 4. 样式定义
            const borderStyle = {
                top: { style: "thin", color: { rgb: "D1D1D6" } },
                bottom: { style: "thin", color: { rgb: "D1D1D6" } },
                left: { style: "thin", color: { rgb: "D1D1D6" } },
                right: { style: "thin", color: { rgb: "D1D1D6" } }
            };

            const headerStyle = {
                font: { bold: true, color: { rgb: "FFFFFF" }, sz: 12, name: "Arial" },
                fill: { fgColor: { rgb: "1C1C1E" } }, // 暗色表头
                alignment: { horizontal: "center", vertical: "center" },
                border: borderStyle
            };

            const titleStyle = {
                font: { bold: true, color: { rgb: "1D1D1F" }, sz: 14, name: "Arial" },
                alignment: { horizontal: "left", vertical: "center" }
            };

            const summaryHeaderStyle = {
                font: { bold: true, color: { rgb: "1D1D1F" }, sz: 11, name: "Arial" },
                fill: { fgColor: { rgb: "F2F2F7" } }, // 浅灰底色
                alignment: { horizontal: "center", vertical: "center" },
                border: borderStyle
            };

            const baseStyle = {
                font: { sz: 11, color: { rgb: "1D1D1F" }, name: "Arial" },
                alignment: { vertical: "center", horizontal: "center" },
                border: borderStyle
            };

            // 获取有效范围
            const range = XLSX.utils.decode_range(ws['!ref']);

            // 行高配置
            ws['!rows'] = [];

            // 合并标题单元格
            ws['!merges'] = [
                { s: { r: 0, c: 0 }, e: { r: 0, c: 4 } }, // 总计汇总标题
                { s: { r: 4, c: 0 }, e: { r: 4, c: 4 } }, // 分类汇总标题
                { s: { r: detailStartRowIndex - 1, c: 0 }, e: { r: detailStartRowIndex - 1, c: 10 } } // 明细清单标题
            ];

            // 5. 遍历所有单元格应用样式
            for (let R = range.s.r; R <= range.e.r; ++R) {
                // 设置行高：标题和表头高一点
                if (R === 0 || R === 4 || R === detailStartRowIndex - 1) {
                    ws['!rows'][R] = { hpx: 35 }; // 大标题
                } else if (R === 1 || R === 5 || R === detailStartRowIndex) {
                    ws['!rows'][R] = { hpx: 30 }; // 表头
                } else if (aoa[R].length > 0) {
                    ws['!rows'][R] = { hpx: 40 }; // 数据行
                }

                for (let C = range.s.c; C <= range.e.c; ++C) {
                    const cellAddress = {c: C, r: R};
                    const cellRef = XLSX.utils.encode_cell(cellAddress);
                    
                    // 如果该行是空行，跳过样式设置
                    if (aoa[R].length === 0) continue;
                    
                    if (!ws[cellRef]) ws[cellRef] = { t: 's', v: '' }; // 填充空单元格

                    // --- 标题行样式 ---
                    if (R === 0 || R === 4 || R === detailStartRowIndex - 1) {
                        if (C === 0) ws[cellRef].s = titleStyle;
                        continue;
                    }

                    // --- 汇总表头样式 ---
                    if (R === 1 || R === 5) {
                        if (C < aoa[R].length) ws[cellRef].s = summaryHeaderStyle;
                        continue;
                    }

                    // --- 汇总数据行样式 ---
                    if (R > 1 && R < 4) { // 总计数据
                        if (C < aoa[R].length) {
                            let cellStyle = JSON.parse(JSON.stringify(baseStyle));
                            cellStyle.font.bold = true;
                            if (C === 2) { // 预算差额
                                const val = String(ws[cellRef].v);
                                if (val.startsWith('+')) cellStyle.font.color = { rgb: "30D158" };
                                else if (val.startsWith('-')) cellStyle.font.color = { rgb: "FF3B30" };
                            }
                            ws[cellRef].s = cellStyle;
                        }
                        continue;
                    }

                    if (R > 5 && R < detailStartRowIndex - 2) { // 分类数据
                        if (C < aoa[R].length) {
                            let cellStyle = JSON.parse(JSON.stringify(baseStyle));
                            ws[cellRef].s = cellStyle;
                        }
                        continue;
                    }

                    // --- 明细清单表头 ---
                    if (R === detailStartRowIndex) {
                        ws[cellRef].s = headerStyle;
                        continue;
                    }

                    // --- 明细数据行样式 ---
                    if (R > detailStartRowIndex) {
                        let cellStyle = JSON.parse(JSON.stringify(baseStyle));
                        
                        const rowDataIndex = R - detailStartRowIndex - 1;
                        const rowData = dataToExport[rowDataIndex];
                        if(!rowData) continue; // 安全检查
                        
                        const bPrice = Number(rowData.budgetPrice) || 0;
                        const aPrice = Number(rowData.actualPrice) || 0;
                        const isOverBudget = bPrice > 0 && aPrice > bPrice;

                        // 金额列处理
                        if (C === 5 || C === 6 || C === 7) {
                            ws[cellRef].t = 'n'; 
                            cellStyle.font.bold = (C === 6 || C === 7); 
                            cellStyle.alignment.horizontal = "right"; 
                            
                            if (C === 6 && isOverBudget) cellStyle.font.color = { rgb: "FF3B30" };
                            
                            if (C === 7) {
                                if (rowData.status === '待购') {
                                    ws[cellRef].t = 's';
                                    cellStyle.font.color = { rgb: "8E8E93" };
                                    cellStyle.alignment.horizontal = "center";
                                } else {
                                    const diff = bPrice - aPrice;
                                    if (diff < 0) cellStyle.font.color = { rgb: "FF3B30" };
                                    else if (diff > 0) cellStyle.font.color = { rgb: "30D158" };
                                }
                            }
                        }

                        // 状态列
                        if (C === 9) {
                            const status = ws[cellRef].v;
                            cellStyle.font.bold = true;
                            if (status === '完成') {
                                cellStyle.font.color = { rgb: "248A3D" };
                                cellStyle.fill = { fgColor: { rgb: "EBF9F0" } };
                            } else if (status === '付款') {
                                cellStyle.font.color = { rgb: "B26800" };
                                cellStyle.fill = { fgColor: { rgb: "FFF6E5" } };
                            } else {
                                cellStyle.font.color = { rgb: "0056B3" };
                                cellStyle.fill = { fgColor: { rgb: "E5F1FF" } };
                            }
                        }
                        
                        // 优先度
                        if (C === 1) {
                            const priority = ws[cellRef].v;
                            cellStyle.font.bold = true;
                            if (priority === '高') cellStyle.font.color = { rgb: "FF3B30" };
                            else if (priority === '中') cellStyle.font.color = { rgb: "FF9F0A" };
                            else cellStyle.font.color = { rgb: "8E8E93" };
                        }

                        if (isOverBudget && C !== 9) cellStyle.fill = { fgColor: { rgb: "FFF2F2" } };

                        if (C === 3 || C === 8 || C === 10) {
                            if (!isOverBudget) cellStyle.font.color = { rgb: "86868B" };
                        }

                        if (C === 10) cellStyle.alignment.wrapText = true;

                        ws[cellRef].s = cellStyle;
                    }
                }
            }

            // 6. 设置列宽 (针对明细表的 11 列)
            ws['!cols'] = [
                { wpx: 150 }, // 名称
                { wpx: 60 },  // 优先度
                { wpx: 80 },  // 分类
                { wpx: 120 }, // 品牌
                { wpx: 50 },  // 数量
                { wpx: 100 }, // 预算
                { wpx: 100 }, // 实际
                { wpx: 100 }, // 差额
                { wpx: 120 }, // 渠道
                { wpx: 80 },  // 状态
                { wpx: 250 }  // 备注
            ];

            // 7. 导出文件
            XLSX.utils.book_append_sheet(wb, ws, "预算清单");
            
            const d = new Date();
            const dateStr = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
            XLSX.writeFile(wb, `装修预算_${dateStr}.xlsx`);
        }

        // --- 初始化启动 ---
        window.onload = init;
    </script>

    <!-- Toast 通知容器 -->
    <div id="toast-container"></div>

    <!-- 背景装饰光晕 3（动态补充 body::before/after 之外的第三个色调） -->
    <div class="bg-orb" style="width:350px;height:350px;background:radial-gradient(circle,rgba(48,209,88,0.08) 0%,transparent 70%);top:40%;right:15%;animation-duration:22s;animation-delay:-8s;"></div>
</body>
