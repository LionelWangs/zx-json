<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>装修预算与采购看板 V3.0</title>
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <!-- SortableJS -->
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
    <!-- SheetJS & xlsx-js-style -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <style>
        /* ============================================================
           V3.0 DESIGN SYSTEM — Tinted Dark · Bento Grid · Glass 2.0
           ============================================================ */
        :root {
            /* ---- Tinted Dark Palette ---- */
            --bg-deep: #08090D;
            --bg-base: #0C0E13;
            --bg-surface: #111318;
            --bg-elevated: #161920;
            --bg-overlay: #1C1F28;

            /* ---- Text Hierarchy ---- */
            --text-primary: #F5F5F7;
            --text-secondary: #98989E;
            --text-tertiary: #6E6E75;
            --text-quaternary: #48484E;

            /* ---- Accent Colors ---- */
            --accent-blue: #0A84FF;
            --accent-blue-soft: #409CFF;
            --accent-green: #30D158;
            --accent-orange: #FF9F0A;
            --accent-red: #FF453A;
            --accent-purple: #BF5AF2;
            --accent-teal: #00BFB3;

            /* ---- Glass 2.0 Tokens (refined, less blur) ---- */
            --glass-blur: blur(20px) saturate(180%);
            --glass-blur-light: blur(12px) saturate(160%);
            --glass-bg: rgba(17, 19, 24, 0.55);
            --glass-bg-hover: rgba(28, 31, 40, 0.65);
            --glass-bg-active: rgba(34, 37, 46, 0.72);
            --glass-border: rgba(255, 255, 255, 0.06);
            --glass-border-hover: rgba(255, 255, 255, 0.10);
            --glass-highlight: inset 0 0.5px 0 rgba(255, 255, 255, 0.07);

            /* ---- Shadows (deeper, more atmospheric) ---- */
            --shadow-xs: 0 1px 2px rgba(0, 0, 0, 0.45);
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.4), 0 0 1px rgba(0, 0, 0, 0.5);
            --shadow-md: 0 8px 32px rgba(0, 0, 0, 0.5), 0 0 0 0.5px rgba(255, 255, 255, 0.04);
            --shadow-lg: 0 16px 48px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 255, 255, 0.05);
            --shadow-xl: 0 24px 64px rgba(0, 0, 0, 0.7);
            --shadow-float: 0 32px 80px rgba(0, 0, 0, 0.75), 0 0 0 1px rgba(255, 255, 255, 0.05);
            --shadow-glow-blue: 0 0 30px rgba(10, 132, 255, 0.12);
            --shadow-glow-green: 0 0 30px rgba(48, 209, 88, 0.10);
            --shadow-glow-orange: 0 0 30px rgba(255, 159, 10, 0.10);

            /* ---- Radius ---- */
            --radius-2xl: 28px;
            --radius-xl: 20px;
            --radius-lg: 16px;
            --radius-md: 12px;
            --radius-sm: 8px;
            --radius-xs: 6px;
            --radius-full: 980px;

            /* ---- Spacing (4px grid) ---- */
            --space-xs: 4px;
            --space-sm: 8px;
            --space-md: 16px;
            --space-lg: 24px;
            --space-xl: 32px;
            --space-2xl: 48px;

            /* ---- Animation Curves ---- */
            --ease-spring: cubic-bezier(0.22, 0.85, 0.15, 1.2);
            --ease-out-expo: cubic-bezier(0.16, 1, 0.3, 1);
            --ease-out-back: cubic-bezier(0.34, 1.56, 0.64, 1);
            --ease-in-out: cubic-bezier(0.4, 0, 0.2, 1);
            --ease-smooth: cubic-bezier(0.25, 0.8, 0.25, 1);

            /* ---- Duration Tokens ---- */
            --dur-fast: 150ms;
            --dur-normal: 250ms;
            --dur-slow: 400ms;
            --dur-glacial: 800ms;

            /* ---- Card Accent Gradients ---- */
            --card-blue-bg: linear-gradient(160deg, rgba(10,132,255,0.10), rgba(10,132,255,0.02));
            --card-green-bg: linear-gradient(160deg, rgba(48,209,88,0.08), rgba(48,209,88,0.02));
            --card-orange-bg: linear-gradient(160deg, rgba(255,159,10,0.08), rgba(255,159,10,0.02));
            --card-purple-bg: linear-gradient(160deg, rgba(191,90,242,0.08), rgba(191,90,242,0.02));
            --card-red-bg: linear-gradient(160deg, rgba(255,69,58,0.10), rgba(255,69,58,0.02));
            --card-teal-bg: linear-gradient(160deg, rgba(0,191,179,0.08), rgba(0,191,179,0.02));

            /* ---- Glass Shine Overlay ---- */
            --shine-subtle: linear-gradient(105deg,
                transparent 35%,
                rgba(255,255,255,0.02) 48%,
                rgba(255,255,255,0.04) 50%,
                rgba(255,255,255,0.02) 52%,
                transparent 65%);
        }

        /* ============================================================
           GLOBAL RESET & BASE
           ============================================================ */
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        html {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Helvetica Neue", Helvetica, Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            -webkit-text-size-adjust: 100%;
            text-size-adjust: 100%;
        }

        body {
            background-color: var(--bg-deep);
            color: var(--text-primary);
            line-height: 1.47059;
            font-weight: 400;
            letter-spacing: -0.022em;
            min-height: 100vh;
            padding-bottom: 80px;
            position: relative;
            overflow-x: hidden;
            /* Layered background: radial orbs + subtle grain */
            background-image:
                radial-gradient(ellipse 900px 500px at 5% 0%, rgba(10, 132, 255, 0.04) 0%, transparent 65%),
                radial-gradient(ellipse 700px 450px at 95% 5%, rgba(191, 90, 242, 0.03) 0%, transparent 65%),
                radial-gradient(ellipse 600px 350px at 60% 15%, rgba(0, 191, 179, 0.025) 0%, transparent 65%),
                radial-gradient(ellipse 500px 300px at 30% 80%, rgba(255, 159, 10, 0.02) 0%, transparent 65%);
            background-repeat: no-repeat;
            background-attachment: fixed;
        }

        /* ---- SVG Noise Texture Overlay ---- */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            opacity: 0.018;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
            background-size: 256px 256px;
        }

        /* ---- Floating Orbs (ambient, slow drift) ---- */
        body::after {
            content: '';
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            background:
                radial-gradient(circle 400px at 15% 10%, rgba(10, 132, 255, 0.07) 0%, transparent 70%),
                radial-gradient(circle 350px at 85% 20%, rgba(191, 90, 242, 0.05) 0%, transparent 70%),
                radial-gradient(circle 300px at 50% 75%, rgba(0, 191, 179, 0.04) 0%, transparent 70%);
            animation: orbDrift 30s ease-in-out infinite alternate;
        }

        @keyframes orbDrift {
            0% { opacity: 0.6; transform: translate(0, 0) scale(1); }
            33% { opacity: 0.8; transform: translate(30px, -15px) scale(1.05); }
            66% { opacity: 0.5; transform: translate(-20px, 10px) scale(0.97); }
            100% { opacity: 0.7; transform: translate(15px, -5px) scale(1.02); }
        }

        /* ============================================================
           HEADER — Refined Glass 2.0
           ============================================================ */
        header {
            position: fixed;
            top: 0; left: 0; right: 0;
            z-index: 2000;
            background: rgba(12, 14, 19, 0.65);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border-bottom: 1px solid var(--glass-border);
            padding: 12px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 1px 0 rgba(0,0,0,0.3), 0 4px 24px rgba(0,0,0,0.4);
            transition: all var(--dur-slow) var(--ease-out-expo);
        }

        header.scrolled {
            padding: 8px 40px;
            background: rgba(12, 14, 19, 0.85);
            box-shadow: 0 1px 0 rgba(0,0,0,0.4), 0 8px 32px rgba(0,0,0,0.6);
        }

        header h1 {
            font-size: 20px;
            font-weight: 650;
            letter-spacing: -0.022em;
            color: var(--text-primary);
            background: linear-gradient(135deg, #F5F5F7 0%, #A1A1A6 60%, #F5F5F7 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header-actions {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .header-actions-group {
            display: flex;
            gap: 2px;
            background: rgba(255,255,255,0.04);
            padding: 3px;
            border-radius: var(--radius-full);
            border: 1px solid var(--glass-border);
            box-shadow: inset 0 0.5px 0 rgba(255,255,255,0.06);
        }

        /* ============================================================
           BUTTON SYSTEM — Pill-shaped, refined feedback
           ============================================================ */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 8px 16px;
            border-radius: var(--radius-full);
            font-size: 13px;
            font-weight: 510;
            letter-spacing: -0.01em;
            cursor: pointer;
            border: none;
            transition: all var(--dur-normal) var(--ease-out-expo);
            outline: none;
            text-decoration: none;
            position: relative;
            overflow: hidden;
            white-space: nowrap;
        }

        .btn:active { transform: scale(0.95); }

        .btn-primary {
            background: var(--accent-blue);
            color: #FFF;
            box-shadow: 0 2px 8px rgba(10, 132, 255, 0.35), inset 0 1px 0 rgba(255,255,255,0.2);
        }
        .btn-primary:hover {
            background: #1a8eff;
            box-shadow: 0 4px 16px rgba(10, 132, 255, 0.5), inset 0 1px 0 rgba(255,255,255,0.25);
            transform: translateY(-1px);
        }

        .btn-outline {
            background: rgba(255,255,255,0.05);
            color: var(--text-primary);
            border: 1px solid rgba(255,255,255,0.08);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            box-shadow: inset 0 0.5px 0 rgba(255,255,255,0.06);
        }
        .btn-outline:hover {
            background: rgba(255,255,255,0.10);
            border-color: rgba(255,255,255,0.14);
            box-shadow: var(--shadow-sm), inset 0 0.5px 0 rgba(255,255,255,0.1);
            transform: translateY(-1px);
        }

        .btn-ghost {
            background: transparent;
            color: var(--text-secondary);
            padding: 8px;
            border-radius: 50%;
        }
        .btn-ghost:hover {
            color: var(--text-primary);
            background: rgba(255,255,255,0.06);
        }
        .btn-ghost:hover i {
            transform: scale(1.12) rotate(-3deg);
            transition: transform 0.3s var(--ease-spring);
        }

        .btn-danger { color: var(--text-secondary); }
        .btn-danger:hover {
            color: var(--accent-red);
            background: rgba(255, 69, 58, 0.12);
        }

        /* ============================================================
           LAYOUT — Sidebar + Main
           ============================================================ */
        .layout-wrapper {
            display: flex;
            max-width: 1440px;
            margin: 0 auto;
            padding: 28px 24px;
            padding-top: 96px;
            gap: 28px;
            align-items: flex-start;
            position: relative;
            z-index: 1;
        }

        .sidebar {
            width: 220px;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            gap: 2px;
            position: sticky;
            top: 96px;
            background: rgba(17, 19, 24, 0.35);
            backdrop-filter: var(--glass-blur-light);
            -webkit-backdrop-filter: var(--glass-blur-light);
            border-radius: var(--radius-xl);
            padding: 8px;
            border: 1px solid var(--glass-border);
            box-shadow: var(--glass-highlight);
        }

        .sidebar-section {
            padding: 8px 12px 4px;
        }

        .sidebar-label {
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            color: var(--text-quaternary);
            margin-bottom: 4px;
            padding-left: 4px;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 14px;
            border-radius: var(--radius-md);
            background: transparent;
            color: var(--text-secondary);
            border: none;
            font-size: 14px;
            font-weight: 500;
            letter-spacing: -0.01em;
            cursor: pointer;
            transition: all var(--dur-normal) var(--ease-out-expo);
            text-align: left;
            outline: none;
            position: relative;
            width: 100%;
        }

        .nav-item:hover {
            background: rgba(255,255,255,0.04);
            color: var(--text-primary);
        }

        .nav-item.active {
            background: rgba(10, 132, 255, 0.12);
            color: var(--accent-blue);
            box-shadow: 0 0 0 0.5px rgba(10, 132, 255, 0.2);
            font-weight: 590;
        }

        .nav-item i {
            font-size: 18px;
            transition: all var(--dur-normal) var(--ease-spring);
            opacity: 0.7;
        }
        .nav-item:hover i { opacity: 1; transform: scale(1.08); }
        .nav-item.active i { opacity: 1; color: var(--accent-blue); }

        .nav-badge {
            margin-left: auto;
            font-size: 11px;
            font-weight: 600;
            padding: 2px 8px;
            border-radius: var(--radius-full);
            background: rgba(255,255,255,0.06);
            color: var(--text-tertiary);
        }
        .nav-item.active .nav-badge {
            background: rgba(10, 132, 255, 0.15);
            color: var(--accent-blue);
        }

        .main-content {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* ============================================================
           TOOLBAR — Refined search & filters
           ============================================================ */
        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            background: rgba(17, 19, 24, 0.45);
            padding: 8px 16px;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-sm), var(--glass-highlight);
            border: 1px solid var(--glass-border);
            backdrop-filter: var(--glass-blur-light);
            -webkit-backdrop-filter: var(--glass-blur-light);
            position: relative;
            z-index: 100;
        }

        .search-box {
            position: relative;
            width: 240px;
        }

        .search-box i {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-tertiary);
            font-size: 15px;
            transition: color 0.2s;
            pointer-events: none;
        }

        .search-input {
            width: 100%;
            padding: 8px 14px 8px 34px;
            border-radius: var(--radius-full);
            border: 1px solid transparent;
            background: rgba(255,255,255,0.04);
            font-size: 13px;
            color: var(--text-primary);
            transition: all var(--dur-normal) var(--ease-out-expo);
            outline: none;
        }

        .search-input::placeholder { color: var(--text-tertiary); }

        .search-input:focus {
            background: rgba(255,255,255,0.07);
            border-color: rgba(10, 132, 255, 0.4);
            box-shadow: 0 0 0 3px rgba(10, 132, 255, 0.1);
        }

        .filter-group {
            display: flex;
            gap: 2px;
            background: rgba(255,255,255,0.03);
            padding: 3px;
            border-radius: var(--radius-full);
        }

        .filter-btn {
            padding: 5px 14px;
            border-radius: var(--radius-full);
            font-size: 12px;
            font-weight: 550;
            letter-spacing: -0.01em;
            color: var(--text-secondary);
            border: none;
            background: transparent;
            cursor: pointer;
            transition: all var(--dur-normal) var(--ease-out-expo);
        }

        .filter-btn:not(.active):hover {
            background: rgba(255,255,255,0.05);
            color: var(--text-primary);
        }

        .filter-btn.active {
            background: rgba(255,255,255,0.1);
            color: #FFF;
            box-shadow: var(--shadow-xs);
        }

        /* ============================================================
           BENTO GRID — Stats & Charts
           ============================================================ */
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1.3fr;
            gap: 16px;
        }

        .stats-subgrid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .stat-card {
            background: rgba(17, 19, 24, 0.5);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-xl);
            padding: 20px 24px;
            box-shadow: var(--shadow-sm), var(--glass-highlight);
            display: flex;
            flex-direction: column;
            gap: 8px;
            backdrop-filter: var(--glass-blur-light);
            -webkit-backdrop-filter: var(--glass-blur-light);
            transition: all var(--dur-slow) var(--ease-out-expo);
            position: relative;
            overflow: hidden;
            cursor: default;
        }

        .stat-card::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: inherit;
            box-shadow: inset 0 0.5px 0 rgba(255,255,255,0.05);
            pointer-events: none;
            z-index: 2;
        }

        .stat-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: radial-gradient(ellipse at 30% 0%, rgba(255,255,255,0.04), transparent 60%);
            opacity: 0;
            transition: opacity var(--dur-slow) var(--ease-out-expo);
            pointer-events: none;
            z-index: 1;
        }

        .stat-card:hover {
            transform: translateY(-3px);
            border-color: var(--glass-border-hover);
            box-shadow: var(--shadow-md), var(--glass-highlight);
        }
        .stat-card:hover::before { opacity: 1; }

        /* Card color variants */
        .stat-card.card-blue { background: var(--card-blue-bg); }
        .stat-card.card-orange { background: var(--card-orange-bg); }
        .stat-card.card-green { background: var(--card-green-bg); }
        .stat-card.card-purple { background: var(--card-purple-bg); }
        .stat-card.card-red { background: var(--card-red-bg); }
        .stat-card.card-teal { background: var(--card-teal-bg); }

        .stat-card.card-blue:hover { box-shadow: var(--shadow-md), var(--shadow-glow-blue); }
        .stat-card.card-orange:hover { box-shadow: var(--shadow-md), var(--shadow-glow-orange); }
        .stat-card.card-green:hover { box-shadow: var(--shadow-md), var(--shadow-glow-green); }

        .stat-card.over-budget {
            background: var(--card-red-bg);
            border-color: rgba(255, 69, 58, 0.2);
        }
        .stat-card.over-budget .value {
            background: none;
            -webkit-text-fill-color: var(--accent-red);
            color: var(--accent-red);
        }
        .stat-card.over-budget .label {
            color: var(--accent-red);
            opacity: 0.9;
        }

        .stat-card.positive .value {
            background: none;
            -webkit-text-fill-color: var(--accent-green);
            color: var(--accent-green);
        }
        .stat-card.positive .label {
            color: var(--accent-green);
            opacity: 0.9;
        }

        .stat-card .label {
            font-size: 11px;
            color: var(--text-tertiary);
            font-weight: 600;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 6px;
            position: relative;
            z-index: 3;
        }

        .stat-card .label i {
            font-size: 15px;
            opacity: 0.7;
        }

        .stat-card .value {
            font-size: 36px;
            font-weight: 700;
            color: var(--text-primary);
            letter-spacing: -0.025em;
            line-height: 1.1;
            font-variant-numeric: tabular-nums;
            background: linear-gradient(180deg, #FFFFFF 0%, rgba(255,255,255,0.75) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            position: relative;
            z-index: 3;
        }

        /* ============================================================
           CHARTS — Unified card style
           ============================================================ */
        .charts-container {
            margin-bottom: 0;
        }

        .charts-grid {
            display: grid;
            grid-template-columns: 3fr 2fr;
            gap: 16px;
        }

        .chart-card {
            background: rgba(17, 19, 24, 0.45);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-xl);
            padding: 20px 24px;
            box-shadow: var(--shadow-sm), var(--glass-highlight);
            backdrop-filter: var(--glass-blur-light);
            -webkit-backdrop-filter: var(--glass-blur-light);
            transition: all var(--dur-slow) var(--ease-out-expo);
            display: flex;
            flex-direction: column;
            gap: 16px;
            position: relative;
            overflow: hidden;
        }

        .chart-card:hover {
            border-color: var(--glass-border-hover);
            box-shadow: var(--shadow-md), var(--shadow-glow-blue);
        }

        .chart-header {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-primary);
            letter-spacing: -0.01em;
            display: flex;
            align-items: center;
            gap: 8px;
            padding-bottom: 12px;
            border-bottom: 1px solid rgba(255,255,255,0.04);
        }

        .chart-body {
            position: relative;
            flex: 1;
            min-height: 240px;
            width: 100%;
        }

        /* ============================================================
           DATA TABLE — Modern refined
           ============================================================ */
        .table-container {
            background: rgba(17, 19, 24, 0.4);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow-sm);
            overflow: hidden;
            backdrop-filter: var(--glass-blur-light);
            -webkit-backdrop-filter: var(--glass-blur-light);
            transition: box-shadow var(--dur-slow) var(--ease-out-expo);
            position: relative;
        }

        .table-container:hover {
            box-shadow: var(--shadow-md);
        }

        /* Scroll gradient indicator at top */
        .table-container::before {
            content: '';
            position: sticky;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            z-index: 12;
            background: linear-gradient(to bottom, rgba(10,132,255,0.06), transparent);
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s;
        }
        .table-container.is-scrolled::before { opacity: 1; }

        table {
            border-collapse: collapse;
            border-spacing: 0;
            width: 100%;
        }

        th {
            background: rgba(22, 25, 32, 0.6);
            padding: 12px 14px;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            color: var(--text-quaternary);
            border-bottom: 1px solid rgba(255,255,255,0.04);
            position: sticky;
            top: 0;
            z-index: 10;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            user-select: none;
            white-space: nowrap;
        }

        .resize-handle {
            position: absolute;
            right: 0;
            top: 0;
            bottom: 0;
            width: 6px;
            cursor: col-resize;
            background: transparent;
            z-index: 15;
            transition: background 0.15s;
        }
        .resize-handle:hover,
        .resize-handle.active {
            background: var(--accent-blue);
        }

        th.sortable {
            cursor: pointer;
            transition: color 0.15s, background 0.15s;
        }
        th.sortable:hover {
            color: var(--text-secondary);
            background: rgba(255,255,255,0.03);
        }
        th.sortable i {
            margin-left: 3px;
            font-size: 13px;
            opacity: 0.25;
            transition: opacity 0.15s, transform 0.3s var(--ease-spring);
        }
        th.sortable:hover i { opacity: 0.6; }
        th.sortable.active i { opacity: 1; color: var(--accent-blue); }
        th.sortable.active.desc i { transform: rotate(180deg); }

        td {
            padding: 12px 14px;
            font-size: 13px;
            border-bottom: 1px solid rgba(255,255,255,0.025);
            vertical-align: middle;
            background: transparent;
            transition: background 0.15s var(--ease-out-expo);
            font-variant-numeric: tabular-nums;
        }

        /* Row hover with subtle highlight + left indicator */
        tr {
            transition: background 0.15s var(--ease-out-expo), transform 0.15s var(--ease-out-expo);
            animation: rowFadeIn 0.4s var(--ease-out-expo) backwards;
        }

        @keyframes rowFadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        tr:nth-child(1) { animation-delay: 0.02s; }
        tr:nth-child(2) { animation-delay: 0.05s; }
        tr:nth-child(3) { animation-delay: 0.08s; }
        tr:nth-child(4) { animation-delay: 0.11s; }
        tr:nth-child(5) { animation-delay: 0.14s; }
        tr:nth-child(6) { animation-delay: 0.17s; }
        tr:nth-child(7) { animation-delay: 0.20s; }
        tr:nth-child(8) { animation-delay: 0.23s; }
        tr:nth-child(9) { animation-delay: 0.26s; }
        tr:nth-child(10) { animation-delay: 0.29s; }

        tr:hover td {
            background: rgba(255,255,255,0.025);
        }

        tr:last-child td { border-bottom: none; }

        /* Over-budget row */
        tr.row-over-budget td {
            background: rgba(255, 69, 58, 0.04);
            border-bottom-color: rgba(255, 69, 58, 0.06);
        }
        tr.row-over-budget:hover td {
            background: rgba(255, 69, 58, 0.07);
        }
        tr.row-over-budget td[data-col="actualPrice"] {
            color: var(--accent-red);
            font-weight: 600;
        }

        /* Drag handle */
        .drag-handle {
            cursor: grab;
            color: var(--text-quaternary);
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color 0.15s, background 0.15s;
            padding: 4px;
            border-radius: 6px;
        }
        .drag-handle:hover {
            color: var(--text-secondary);
            background: rgba(255,255,255,0.06);
        }
        .drag-handle:active { cursor: grabbing; transform: scale(0.9); }

        .sortable-ghost { opacity: 0.2; background: rgba(10,132,255,0.08); border-radius: var(--radius-md); }
        .sortable-drag {
            background: rgba(22, 25, 32, 0.95);
            box-shadow: var(--shadow-xl);
            cursor: grabbing !important;
            border-radius: var(--radius-md);
            border: 1px solid rgba(255,255,255,0.08);
            transform: scale(1.01);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
        }

        /* ============================================================
           STATUS BADGES
           ============================================================ */
        .status-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 3px 12px;
            border-radius: var(--radius-full);
            font-size: 11px;
            font-weight: 650;
            letter-spacing: 0.01em;
            white-space: nowrap;
            min-width: 48px;
        }
        .status-badge::before {
            content: '';
            display: inline-block;
            width: 5px;
            height: 5px;
            border-radius: 50%;
            margin-right: 6px;
        }

        .status-done {
            background: rgba(48, 209, 88, 0.1);
            color: var(--accent-green);
        }
        .status-done::before {
            background: var(--accent-green);
            box-shadow: 0 0 5px rgba(48, 209, 88, 0.5);
        }

        .status-paid {
            background: rgba(255, 159, 10, 0.1);
            color: var(--accent-orange);
        }
        .status-paid::before {
            background: var(--accent-orange);
            box-shadow: 0 0 5px rgba(255, 159, 10, 0.5);
        }

        .status-pending {
            background: rgba(10, 132, 255, 0.1);
            color: var(--accent-blue);
        }
        .status-pending::before {
            background: var(--accent-blue);
            box-shadow: 0 0 5px rgba(10, 132, 255, 0.5);
        }

        /* ============================================================
           COLUMN MENU
           ============================================================ */
        .column-menu {
            position: absolute;
            top: 100%;
            right: 0;
            margin-top: 8px;
            background: rgba(22, 25, 32, 0.9);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-lg);
            padding: 6px;
            box-shadow: var(--shadow-xl);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            z-index: 1000;
            display: flex;
            flex-direction: column;
            gap: 2px;
            min-width: 150px;
        }

        .column-menu label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: var(--text-primary);
            padding: 7px 10px;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.15s;
            white-space: nowrap;
        }
        .column-menu label:hover {
            background: rgba(255,255,255,0.06);
        }
        .column-menu input[type="checkbox"] {
            accent-color: var(--accent-blue);
        }

        /* ============================================================
           MODAL / SHEET — iOS-inspired
           ============================================================ */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            z-index: 3000;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            visibility: hidden;
            transition: all var(--dur-slow) var(--ease-out-expo);
        }
        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal {
            background: rgba(22, 25, 32, 0.88);
            border-radius: var(--radius-2xl);
            width: 100%;
            max-width: 560px;
            box-shadow: var(--shadow-float), 0 0 80px rgba(10, 132, 255, 0.04);
            transform: translateY(24px) scale(0.96);
            transition: all 0.5s var(--ease-spring);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            min-height: 500px;
            max-height: calc(100vh - 60px);
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            position: relative;
        }
        .modal-overlay.active .modal {
            transform: translateY(0) scale(1);
        }

        /* Sheet drag indicator (only on main modal) */
        .sheet-indicator {
            width: 36px;
            height: 5px;
            background: rgba(255,255,255,0.15);
            border-radius: 3px;
            margin: 10px auto 0;
        }

        .modal-header {
            padding: 20px 28px 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.04);
        }
        .modal-header h2 {
            font-size: 20px;
            font-weight: 680;
            letter-spacing: -0.022em;
            color: var(--text-primary);
        }

        .modal-header .btn-ghost {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: rgba(255,255,255,0.04);
            transition: all var(--dur-normal) var(--ease-spring);
        }
        .modal-header .btn-ghost:hover {
            background: rgba(255,255,255,0.12);
            transform: rotate(90deg);
        }

        .modal-body {
            padding: 16px 28px 24px;
            overflow-y: auto;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px 14px;
            flex: 1;
        }
        .modal-body::-webkit-scrollbar { width: 4px; }
        .modal-body::-webkit-scrollbar-track { background: transparent; }
        .modal-body::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 10px; }

        .form-group { display: flex; flex-direction: column; gap: 6px; }
        .form-group.full { grid-column: span 2; }
        .form-group label {
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.03em;
            text-transform: uppercase;
            color: var(--text-tertiary);
        }

        .form-control {
            padding: 10px 14px;
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 10px;
            font-size: 14px;
            color: var(--text-primary);
            background: rgba(255,255,255,0.03);
            transition: all var(--dur-normal) var(--ease-out-expo);
            outline: none;
            width: 100%;
        }
        .form-control:hover { background: rgba(255,255,255,0.05); }
        .form-control:focus {
            background: rgba(255,255,255,0.06);
            border-color: var(--accent-blue);
            box-shadow: 0 0 0 3px rgba(10, 132, 255, 0.12);
        }
        .form-control option { background: var(--bg-elevated); color: var(--text-primary); }
        textarea.form-control {
            resize: vertical;
            min-height: 60px;
            line-height: 1.5;
        }

        .modal-footer {
            padding: 14px 28px 20px;
            border-top: 1px solid rgba(255,255,255,0.04);
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            background: rgba(17, 19, 24, 0.3);
        }

        body.modal-open { overflow: hidden; }
        #fileInput { display: none; }

        /* ============================================================
           EMPTY STATE
           ============================================================ */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-secondary);
            background: rgba(17, 19, 24, 0.2);
            border-radius: var(--radius-xl);
            border: 1px solid rgba(255,255,255,0.03);
            margin: 20px;
            position: relative;
        }
        .empty-state i {
            font-size: 44px;
            color: var(--text-quaternary);
            margin-bottom: 14px;
            display: block;
            animation: emptyFloat 3.5s ease-in-out infinite;
        }
        .empty-state p {
            font-size: 15px;
            font-weight: 500;
            position: relative;
            z-index: 1;
        }

        @keyframes emptyFloat {
            0%, 100% { transform: translateY(0) scale(1); opacity: 0.4; }
            50% { transform: translateY(-10px) scale(1.04); opacity: 0.7; }
        }
        /* ============================================================
           MOBILE RESPONSIVE (≤768px)
           ============================================================ */
        @media (max-width: 768px) {
            header {
                padding: 10px 16px;
                flex-wrap: wrap;
                gap: 8px;
            }
            header h1 { font-size: 17px; }
            .header-actions {
                width: 100%;
                justify-content: flex-start;
                flex-wrap: wrap;
                gap: 4px;
            }

            .layout-wrapper {
                flex-direction: column;
                padding: 12px;
                padding-top: 120px;
                gap: 14px;
            }

            .sidebar {
                width: 100%;
                flex-direction: row;
                position: static;
                overflow-x: auto;
                -webkit-overflow-scrolling: touch;
                gap: 2px;
                padding: 4px;
                border-radius: var(--radius-lg);
            }
            .sidebar-section { display: none; }
            .nav-item {
                flex: 0 0 auto;
                padding: 8px 14px;
                white-space: nowrap;
                font-size: 13px;
                border-radius: var(--radius-full);
            }
            .nav-item:hover { transform: none; }
            .nav-badge { display: none; }

            .stats-grid {
                grid-template-columns: 1fr 1fr;
                gap: 8px;
            }
            .stat-card[style*="grid-column"] {
                grid-column: 1 / -1 !important;
            }
            .stat-card[style*="grid-row"] {
                grid-row: auto !important;
            }
            .stats-subgrid { gap: 8px; }

            .stat-card {
                padding: 14px 16px;
                gap: 4px;
            }
            .stat-card .value {
                font-size: 24px;
                background: none;
                -webkit-text-fill-color: var(--text-primary);
                color: var(--text-primary);
            }
            .stat-card.over-budget .value { -webkit-text-fill-color: var(--accent-red); }
            .stat-card.positive .value { -webkit-text-fill-color: var(--accent-green); }
            .stat-card .label { font-size: 10px; }

            .charts-grid { grid-template-columns: 1fr; }
            .chart-card { padding: 14px; }
            .chart-body { min-height: 180px; }

            .toolbar {
                flex-direction: column;
                align-items: stretch;
                gap: 8px;
                padding: 8px 12px;
            }
            .search-box { width: 100%; }
            .filter-group {
                overflow-x: auto;
                -webkit-overflow-scrolling: touch;
                white-space: nowrap;
            }
            .column-menu { right: auto; left: 0; }

            .table-container {
                overflow-x: hidden;
                border-radius: var(--radius-lg);
            }

            table { width: 100%; table-layout: fixed; min-width: 100%; }
            table th, table td {
                padding: 8px 2px;
                font-size: 10px;
                text-align: center !important;
            }

            /* Hide non-essential columns */
            table th[data-col="drag"], table td[data-col="drag"],
            table th[data-col="priority"], table td[data-col="priority"],
            table th[data-col="category"], table td[data-col="category"],
            table th[data-col="brand"], table td[data-col="brand"],
            table th[data-col="quantity"], table td[data-col="quantity"],
            table th[data-col="diffPrice"], table td[data-col="diffPrice"],
            table th[data-col="channel"], table td[data-col="channel"],
            table th[data-col="notes"], table td[data-col="notes"] {
                display: none !important;
            }

            table th[data-col="name"], table td[data-col="name"] {
                width: auto !important;
                min-width: 0 !important;
                max-width: none !important;
                white-space: normal;
                word-break: break-all;
                padding-left: 4px !important;
                padding-right: 4px;
                text-align: left !important;
            }

            table th[data-col="budgetPrice"], table th[data-col="actualPrice"] {
                font-size: 0;
                width: 46px !important;
                min-width: 46px !important;
                max-width: 46px !important;
            }
            table th[data-col="budgetPrice"]::before { content: "预算"; font-size: 10px; }
            table th[data-col="actualPrice"]::before { content: "实际"; font-size: 10px; }

            table td[data-col="budgetPrice"], table td[data-col="actualPrice"] {
                font-size: 10px;
                width: 46px !important;
                min-width: 46px !important;
                max-width: 46px !important;
                overflow: hidden;
                text-overflow: ellipsis;
            }

            table th[data-col="status"], table td[data-col="status"] {
                width: 40px !important;
                min-width: 40px !important;
                max-width: 40px !important;
            }

            .status-badge {
                width: 8px;
                height: 8px;
                min-width: 8px;
                padding: 0;
                font-size: 0;
                border-radius: 50%;
                background: transparent;
            }
            .status-badge::before { width: 8px; height: 8px; margin-right: 0; }

            table th[data-col="actions"], table td[data-col="actions"] {
                width: 40px !important;
                min-width: 40px !important;
                max-width: 40px !important;
            }
            table td[data-col="actions"] .btn { padding: 2px; }
            table td[data-col="actions"] .btn i { font-size: 15px; }

            .modal {
                max-width: 100%;
                min-height: 100dvh;
                max-height: 100dvh;
                border-radius: 0;
                margin: 0;
            }
            .modal-body {
                padding: 12px 16px;
                grid-template-columns: 1fr;
                gap: 10px;
            }
            .modal-footer { padding: 12px 16px 28px; }
            .form-group.full { grid-column: span 1; }

            /* Touch: disable hover-only effects */
            @media (hover: none) {
                tr:hover td { background: transparent; }
                tr.row-over-budget:hover td { background: rgba(255,69,58,0.04); }
                .stat-card:hover { transform: none; }
                .stat-card:hover::before { opacity: 0; }
                .chart-card:hover { transform: none; }
            }
        }

        /* ============================================================
           QUALITY: Scrollbar, Selection, Reduced Motion
           ============================================================ */
        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.08);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.14); }
        * { scrollbar-width: thin; scrollbar-color: rgba(255,255,255,0.08) transparent; }

        ::selection {
            background: rgba(10, 132, 255, 0.25);
            color: #FFF;
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }

        /* ============================================================
           ENTRANCE ANIMATIONS
           ============================================================ */
        @keyframes cardFadeIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .layout-wrapper {
            animation: cardFadeIn 0.6s var(--ease-out-expo) forwards;
        }
        .stat-card { animation: cardFadeIn 0.5s var(--ease-out-expo) backwards; }
        .stat-card:nth-child(1) { animation-delay: 0.04s; }
        .stat-card:nth-child(2) { animation-delay: 0.10s; }
        .stat-card:nth-child(3) { animation-delay: 0.16s; }
        .stat-card:nth-child(4) { animation-delay: 0.22s; }
        .chart-card { animation: cardFadeIn 0.5s var(--ease-out-expo) backwards; }
        .chart-card:nth-child(1) { animation-delay: 0.08s; }
        .chart-card:nth-child(2) { animation-delay: 0.20s; }

        /* ============================================================
           TOAST NOTIFICATIONS
           ============================================================ */
        #toast-container {
            position: fixed;
            bottom: 28px;
            right: 28px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 8px;
            pointer-events: none;
        }

        .toast {
            pointer-events: auto;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 13px 18px;
            border-radius: var(--radius-lg);
            background: rgba(28, 31, 40, 0.94);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--glass-border);
            box-shadow: var(--shadow-xl);
            font-size: 13px;
            font-weight: 500;
            color: var(--text-primary);
            min-width: 260px;
            max-width: 400px;
            transform: translateX(120%);
            opacity: 0;
            transition: transform 0.45s var(--ease-spring), opacity 0.35s ease;
            position: relative;
            overflow: hidden;
        }
        .toast.show { transform: translateX(0); opacity: 1; }
        .toast.hide { transform: translateX(120%); opacity: 0; }
        .toast::before {
            content: '';
            position: absolute;
            left: 0; top: 0; bottom: 0;
            width: 3px;
        }
        .toast.success::before { background: var(--accent-green); }
        .toast.error::before { background: var(--accent-red); }
        .toast.info::before { background: var(--accent-blue); }
        .toast i { font-size: 18px; }
        .toast.success i { color: var(--accent-green); }
        .toast.error i { color: var(--accent-red); }
        .toast.info i { color: var(--accent-blue); }

        /* ============================================================
           RIPPLE EFFECT
           ============================================================ */
        @keyframes rippleAnim {
            to { transform: scale(4); opacity: 0; }
        }
        .ripple-container {
            position: absolute;
            inset: 0;
            border-radius: inherit;
            overflow: hidden;
            pointer-events: none;
            z-index: 0;
        }
        .ripple {
            position: absolute;
            border-radius: 50%;
            background: rgba(255,255,255,0.3);
            transform: scale(0);
            animation: rippleAnim 0.6s ease-out forwards;
            pointer-events: none;
        }
        .btn-primary .ripple { background: rgba(255,255,255,0.4); }
        .btn-danger .ripple { background: rgba(255,69,58,0.35); }
        .btn { position: relative; overflow: hidden; }

        /* ============================================================
           ROW LEAVE ANIMATION
           ============================================================ */
        @keyframes rowLeave {
            from { opacity: 1; transform: scale(1); max-height: 60px; }
            to { opacity: 0; transform: scale(0.95); max-height: 0; padding: 0; }
        }
        tr.row-leave {
            animation: rowLeave 0.3s var(--ease-out-expo) forwards;
            overflow: hidden;
        }
        tr.row-leave td { padding: 0 !important; border: none !important; }

        @keyframes valuePop {
            0% { transform: scale(1); }
            35% { transform: scale(1.06); }
            65% { transform: scale(0.97); }
            100% { transform: scale(1); }
        }
        .stat-card .value.value-pop {
            animation: valuePop 0.4s var(--ease-spring);
        }

        @keyframes shakeNoResult {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-5px); }
            40% { transform: translateX(5px); }
            60% { transform: translateX(-3px); }
            80% { transform: translateX(3px); }
        }
        .search-input.no-result {
            animation: shakeNoResult 0.45s ease;
            border-color: rgba(255,69,58,0.3);
        }

        /* ============================================================
           BACKGROUND ORB
           ============================================================ */
        .bg-orb {
            position: fixed;
